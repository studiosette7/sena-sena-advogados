<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel — Sena &amp; Sena Advogados</title>
<meta name="theme-color" content="#0F1E38">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2316294A'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Georgia,serif' fill='%23E0B959'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --marinho:#16294A; --marinho-2:#1B3157; --marinho-3:#0F1E38; --marinho-4:#22406E;
  --ouro:#E0B959; --ouro-2:#C99A3E; --ouro-txt:#7A5F27;
  --fundo:#F2F3F5; --branco:#fff;
  --texto:#16294A; --cinza:#5E6A7D; --cinza-2:#8792A3;
  --linha:#E4E6EB; --linha-2:#EEF0F3;
  --verde:#1F7A4D; --verde-cl:#E7F3ED;
  --vermelho:#B3261E; --vermelho-cl:#FBEAE8;
  --ambar:#8A5A00; --ambar-cl:#FCF2DF;
  --roxo:#5B4B9E; --roxo-cl:#EFEBFA;
  --azul:#1F5FA8; --azul-cl:#E8F0FA;
  --ff:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --sombra:0 1px 2px rgba(16,30,54,.04),0 1px 3px rgba(16,30,54,.06);
  --sombra-2:0 4px 8px rgba(16,30,54,.06),0 12px 32px rgba(16,30,54,.10);
  --lado:236px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ff);background:var(--fundo);color:var(--texto);
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
fieldset{border:0;min-width:0}
svg{display:block}
:focus-visible{outline:2.5px solid var(--ouro-2);outline-offset:2px;border-radius:5px}
.escuro :focus-visible{outline-color:var(--ouro)}
.oculto{display:none !important}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ======================== LOGIN ======================== */
.entrada{min-height:100vh;min-height:100svh;display:grid;place-items:center;
  background:var(--marinho-3);padding:24px}
.cartao-entrada{width:100%;max-width:380px;background:var(--branco);
  border-radius:18px;padding:38px 32px 30px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.cartao-entrada>img{width:186px;margin:0 auto 26px}
.campo{margin-bottom:13px}
.campo>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--cinza)}
.campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;
  border:1.5px solid var(--linha);border-radius:9px;background:var(--branco);font-size:14.5px}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--ouro-2);outline:none}
textarea{resize:vertical;min-height:76px;line-height:1.5}
.erro{color:var(--vermelho);font-size:13px;margin-top:10px;min-height:1.1em}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;
  background:var(--marinho);color:#fff;transition:filter .14s,background .14s;white-space:nowrap}
.bt:hover:not(:disabled){filter:brightness(1.2)}
.bt:disabled{opacity:.5;cursor:not-allowed}
.bt svg{width:16px;height:16px;stroke-width:2}
.bt-ouro{background:var(--ouro);color:#20180A}
.bt-fino{background:var(--branco);color:var(--marinho);border:1.5px solid var(--linha)}
.bt-fino:hover:not(:disabled){background:var(--linha-2);filter:none}
.bt-larg{width:100%}
.bt-mini{padding:6px 11px;font-size:13px;border-radius:8px}

/* ======================== CASCA ======================== */
.app{display:grid;grid-template-columns:var(--lado) 1fr;min-height:100vh;min-height:100svh}

.lateral{background:var(--marinho-3);color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;height:100svh;padding:20px 14px 16px}
.lateral>img{width:150px;margin:4px 8px 26px}
.nav{display:grid;gap:2px}
.nav-rot{font-size:10px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.34);
  padding:20px 12px 7px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;
  font-size:14.5px;color:rgba(255,255,255,.72);transition:background .14s,color .14s}
.nav a svg{width:18px;height:18px;stroke-width:1.9;flex:none}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.nav a .selo-n{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;
  background:var(--ouro);color:#20180A}
.eu{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.11)}
.eu-l{display:flex;align-items:center;gap:10px;padding:4px 8px}
.eu-av{width:34px;height:34px;border-radius:50%;background:var(--marinho-4);color:var(--ouro);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.eu-n{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eu-s{font-size:11.5px;color:rgba(255,255,255,.5)}
.bt-sair{display:block;width:100%;text-align:left;padding:8px 8px;margin-top:6px;
  font-size:13px;color:rgba(255,255,255,.6);border-radius:8px}
.bt-sair:hover{background:rgba(255,255,255,.08);color:#fff}

.principal{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:20;background:rgba(242,243,245,.9);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--linha);
  display:flex;align-items:center;gap:16px;padding:0 26px;height:62px}
.topo h1{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.busca-cx{position:relative;flex:1;max-width:430px;margin-left:8px}
.busca-cx svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke-width:2;color:var(--cinza-2)}
.busca{width:100%;padding:8px 12px 8px 36px;border:1.5px solid var(--linha);
  border-radius:9px;background:var(--branco);font-size:14px}
.busca:focus{border-color:var(--ouro-2);outline:none}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:8px}
.sino{position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:var(--cinza)}
.sino:hover{background:var(--linha-2)}
.sino svg{width:19px;height:19px;stroke-width:1.9}
.sino b{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;
  border-radius:99px;background:var(--vermelho);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center}
.conteudo{padding:22px 26px 60px;max-width:1560px;width:100%}

/* ======================== PEÇAS ======================== */
.bloco{background:var(--branco);border:1px solid var(--linha);border-radius:14px;
  box-shadow:var(--sombra)}
.bloco-cab{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--linha-2)}
.bloco-cab h2,.bloco-cab h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.bloco-cab .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.bloco-corpo{padding:18px}
.vazio{padding:40px 20px;text-align:center;color:var(--cinza-2);font-size:13.5px}
.vazio svg{width:32px;height:32px;margin:0 auto 10px;stroke-width:1.5;color:var(--linha)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:99px;background:var(--linha-2);color:var(--cinza);white-space:nowrap}
.tag-verde{background:var(--verde-cl);color:var(--verde)}
.tag-vermelho{background:var(--vermelho-cl);color:var(--vermelho)}
.tag-ambar{background:var(--ambar-cl);color:var(--ambar)}
.tag-roxo{background:var(--roxo-cl);color:var(--roxo)}
.tag-azul{background:var(--azul-cl);color:var(--azul)}
.ponto{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:15px 16px;
  box-shadow:var(--sombra);display:grid;gap:2px;text-align:left;transition:box-shadow .14s,transform .14s}
button.kpi:hover{box-shadow:var(--sombra-2);transform:translateY(-1px)}
.kpi-t{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--cinza-2)}
.kpi-t svg{width:14px;height:14px;stroke-width:2}
.kpi-n{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.kpi-s{font-size:12.5px;color:var(--cinza)}
.kpi-alerta .kpi-n{color:var(--vermelho)}
.kpi-alerta .kpi-t{color:var(--vermelho)}

/* sem o min-width:0 o item de grade cresce até caber o conteúdo,
   e aí não é a coluna que manda, é o texto mais comprido */
.grade{display:grid;gap:14px}
.grade>*{min-width:0}
.g-2{grid-template-columns:1.5fr 1fr}
.g-2b{grid-template-columns:1fr 1fr}

/* gráfico de barras */
.barras{display:grid;gap:9px}
.barra{display:grid;grid-template-columns:104px 1fr 32px;align-items:center;gap:11px;font-size:13px}
.barra-t{color:var(--cinza);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-r{height:9px;border-radius:99px;background:var(--linha-2);overflow:hidden}
.barra-r i{display:block;height:100%;border-radius:99px;background:var(--marinho-4);
  transition:width .5s cubic-bezier(.4,0,.2,1)}
.barra-n{text-align:right;font-weight:600;font-size:13px}

/* rosca */
.rosca-cx{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.rosca{position:relative;width:150px;height:150px;flex:none}
.rosca-meio{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rosca-meio b{font-size:26px;font-weight:700;line-height:1}
.rosca-meio span{font-size:11px;color:var(--cinza-2)}
.legenda{display:grid;gap:7px;font-size:13px}
.legenda div{display:flex;align-items:center;gap:8px}
.legenda i{width:9px;height:9px;border-radius:3px;flex:none}

/* colunas de semana */
.semanas{display:flex;align-items:flex-end;gap:8px;height:104px;padding-top:6px}
.semana{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.semana i{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--ouro);
  min-height:3px;transition:height .5s cubic-bezier(.4,0,.2,1)}
.semana b{font-size:11.5px;font-weight:600}
.semana span{font-size:10.5px;color:var(--cinza-2)}

/* listas */
.linha-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 18px;border-top:1px solid var(--linha-2);transition:background .12s}
.linha-item:first-child{border-top:0}
button.linha-item:hover{background:var(--linha-2)}
/* display:block é obrigatório aqui: em elemento inline o overflow:hidden
   não corta nada, e nome comprido empurrava a página inteira no celular */
.li-p{flex:1;min-width:0;display:block}
.li-t{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{display:block;font-size:12.5px;color:var(--cinza);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-d{text-align:right;flex:none;display:grid;gap:3px;justify-items:end;max-width:44%}
.icone-cx{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.icone-cx svg{width:17px;height:17px;stroke-width:2}

/* ações rápidas */
.rapidas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px}
.rapida{display:grid;gap:6px;padding:14px;border:1px solid var(--linha);border-radius:12px;
  text-align:left;transition:border-color .14s,box-shadow .14s,transform .14s}
.rapida:hover{border-color:var(--ouro-2);box-shadow:var(--sombra-2);transform:translateY(-1px)}
.rapida .icone-cx{margin-bottom:2px}
.rapida b{font-size:14px;font-weight:600}
.rapida span{font-size:12.5px;color:var(--cinza);line-height:1.4}

/* ---- barra de vista (quadro/lista + áreas) ---- */
.barra-vista{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.alterna{display:flex;background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:3px;gap:2px}
.alterna button{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;
  font-size:13.5px;font-weight:500;color:var(--cinza)}
.alterna button svg{width:15px;height:15px;stroke-width:2}
.alterna button:hover{background:var(--linha-2);color:var(--texto)}
.alterna button[aria-pressed="true"]{background:var(--marinho);color:#fff;font-weight:600}
.areas{display:flex;gap:6px;flex-wrap:wrap}
.chip-area{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
  border:1px solid var(--linha);background:var(--branco);font-size:13px;color:var(--cinza)}
.chip-area:hover{border-color:var(--cinza-2);color:var(--texto)}
.chip-area[aria-pressed="true"]{background:var(--marinho);border-color:var(--marinho);color:#fff;font-weight:600}
.chip-area .n{font-size:11.5px;opacity:.65;font-weight:600}

/* ======================== ESTEIRA ======================== */
.esteira{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.coluna{flex:0 0 262px;background:#EDEFF2;border-radius:13px;padding:10px;
  display:flex;flex-direction:column;gap:9px;min-height:130px;transition:background .14s,box-shadow .14s}
.coluna.alvo{background:#E3E9F2;box-shadow:inset 0 0 0 2px var(--ouro-2)}
.coluna-cab{display:flex;align-items:center;gap:8px;padding:2px 4px}
.coluna-cab b{font-size:13px;font-weight:600}
.coluna-cab .n{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--cinza);
  background:var(--branco);border-radius:99px;padding:1px 8px}
.coluna-vazia{font-size:11.5px;color:var(--cinza-2);padding:14px 6px;text-align:center;
  border:1.5px dashed #DCE0E6;border-radius:9px}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:11px;
  padding:11px 12px;text-align:left;width:100%;display:grid;gap:7px;cursor:pointer;
  box-shadow:var(--sombra);transition:box-shadow .14s,transform .14s}
.cartao:hover{box-shadow:var(--sombra-2);transform:translateY(-1px)}
.cartao:active{cursor:grabbing}
.cartao.arrastando{opacity:.4}
.cartao-n{font-weight:600;font-size:14px;line-height:1.3}
.cartao-s{font-size:12px;color:var(--cinza);display:flex;align-items:center;gap:6px}
.cartao-r{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cartao-b{height:3px;border-radius:99px;background:var(--linha-2);overflow:hidden}
.cartao-b i{display:block;height:100%;border-radius:99px}

/* ======================== TABELA ======================== */
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--cinza-2);padding:10px 14px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--linha-2);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--linha-2)}
td .nm{font-weight:600}
td .sb{font-size:12px;color:var(--cinza)}

/* ======================== AGENDA ======================== */
.agenda-grade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,342px);gap:14px;align-items:start}
.agenda-grade>*{min-width:0;max-width:100%}
/* a coluna da direita é uma pilha de cartões: sem o min-width:0 em cada
   nível, o nome comprido de um cliente estica a coluna inteira */
.agenda-lado{display:grid;gap:14px;min-width:0}
.agenda-lado>*{min-width:0;max-width:100%}
.mes{display:flex;align-items:center;gap:8px;padding:15px 18px;border-bottom:1px solid var(--linha-2)}
/* nada de text-transform:capitalize aqui — ele deixaria "Agosto De 2026" */
.mes b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.mes b::first-letter{text-transform:uppercase}
.mes-nav{display:flex;gap:2px;margin-right:4px}
.mes-nav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--cinza)}
.mes-nav button:hover{background:var(--linha-2);color:var(--texto)}
.mes-nav svg{width:15px;height:15px;stroke-width:2}

.cal{padding:10px 12px 14px}
/* minmax(0,1fr) e não 1fr: com 1fr a coluna cresce até caber o título do
   compromisso, e aí os dias ficam de larguras diferentes e o calendário
   empurra o painel do dia pra fora da tela */
.cal-cab,.cal-corpo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-d{padding:6px 0 9px;text-align:center;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--cinza-2)}
.cal-corpo{gap:3px}
.cal-c{min-width:0;min-height:92px;border-radius:9px;padding:5px;display:flex;flex-direction:column;gap:3px;
  text-align:left;transition:background .12s;align-items:stretch}
.cal-c:hover{background:var(--linha-2)}
.cal-c.fora{opacity:.38}
.cal-c.sel{background:#EEF2F8;box-shadow:inset 0 0 0 1.5px var(--marinho-4)}
.cal-n{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:600;color:var(--cinza);flex:none}
.cal-c.hoje .cal-n{background:var(--marinho);color:#fff}
.ev{font-size:11px;font-weight:500;padding:3px 7px;border-radius:6px;text-align:left;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35;
  border-left:2.5px solid currentColor}
.ev b{font-weight:700}
.ev-audiencia{background:var(--vermelho-cl);color:var(--vermelho)}
.ev-prazo{background:var(--ambar-cl);color:var(--ambar)}
.ev-tarefa{background:var(--azul-cl);color:var(--azul)}
.ev-reuniao{background:var(--roxo-cl);color:var(--roxo)}
.ev-prescricao{background:#F3E8E7;color:#7A1F19;font-weight:600}
.ev.feito{opacity:.45;text-decoration:line-through}
.ev-mais{font-size:10.5px;color:var(--cinza-2);padding-left:7px;font-weight:600}
.cal-legenda{display:flex;gap:14px;flex-wrap:wrap;padding:12px 18px 0;border-top:1px solid var(--linha-2);
  margin-top:10px;font-size:12px;color:var(--cinza)}
.cal-legenda span{display:flex;align-items:center;gap:6px}
.cal-legenda i{width:9px;height:9px;border-radius:3px;flex:none}

.dia-cab{padding:15px 18px;border-bottom:1px solid var(--linha-2)}
.dia-cab b{font-size:16px;font-weight:600;display:block}
.dia-cab span{font-size:12.5px;color:var(--cinza)}
@media (max-width:1180px){ .agenda-grade{grid-template-columns:1fr} }

/* ======================== ASSISTENTE ======================== */
.assist-abas{display:flex;gap:2px;background:var(--branco);border:1px solid var(--linha);
  border-radius:11px;padding:3px;margin-bottom:16px;width:max-content;max-width:100%;overflow-x:auto}
.assist-abas button{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;
  font-size:14px;font-weight:500;color:var(--cinza);white-space:nowrap}
.assist-abas button svg{width:16px;height:16px;stroke-width:2}
.assist-abas button:hover{background:var(--linha-2);color:var(--texto)}
.assist-abas button[aria-pressed="true"]{background:var(--marinho);color:#fff;font-weight:600}

.solta{display:grid;place-items:center;gap:5px;padding:26px 18px;margin-bottom:14px;
  border:1.5px dashed #CFD5DE;border-radius:12px;cursor:pointer;text-align:center;
  transition:border-color .14s,background .14s}
.solta:hover{border-color:var(--ouro-2);background:#FFFDF7}
.solta svg{width:26px;height:26px;stroke-width:1.6;color:var(--cinza-2)}
.solta b{font-size:14px;font-weight:600;word-break:break-all}
.solta span{font-size:12.5px;color:var(--cinza-2)}

.atalhos{display:grid;gap:6px;margin-top:16px}
.atalhos button{text-align:left;font-size:12.5px;color:var(--cinza);padding:8px 12px;
  border:1px solid var(--linha);border-radius:9px;line-height:1.4}
.atalhos button:hover{border-color:var(--ouro-2);color:var(--texto);background:#FFFDF7}

.pensando{font-size:13.5px;color:var(--cinza);padding:16px;background:var(--fundo);
  border-radius:10px;margin-top:16px;line-height:1.5}
.pensando::before{content:'';display:inline-block;width:12px;height:12px;margin-right:9px;
  vertical-align:-1px;border:2px solid rgba(22,41,74,.2);border-top-color:var(--marinho);
  border-radius:50%;animation:gira .7s linear infinite}

.resposta{margin-top:16px;font-size:14px;line-height:1.62}
.resposta p{margin-bottom:9px}
.resposta h4{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--cinza-2);margin:16px 0 6px}
.resposta ul.itens{margin-bottom:9px}
ul.fontes{list-style:none;display:grid;gap:5px;font-size:12.5px}
ul.fontes a{color:var(--azul);text-decoration:underline;text-underline-offset:2px;
  overflow-wrap:anywhere}
.peca{white-space:pre-wrap;font-size:13.5px;line-height:1.65;background:var(--fundo);
  border:1px solid var(--linha);border-radius:10px;padding:18px;max-height:640px;overflow-y:auto}

/* ---- chat ---- */
.chat-grade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:14px;align-items:start}
.chat-grade>*{min-width:0}
.chat{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:460px}
.chat-corpo{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.chat-pe{border-top:1px solid var(--linha-2);padding:12px 16px 14px}

.msg{display:flex;gap:10px;max-width:100%}
.msg-eu{justify-content:flex-end}
.msg-eu .balao{background:var(--marinho);color:#fff;border-radius:14px 14px 4px 14px;
  padding:10px 14px;max-width:76%;white-space:pre-wrap;font-size:14px;line-height:1.55}
.msg-ia .balao{background:var(--fundo);border:1px solid var(--linha);border-radius:14px 14px 14px 4px;
  padding:13px 16px;max-width:calc(100% - 42px);font-size:14px;line-height:1.62;min-width:0}
.msg-av{width:32px;height:32px;border-radius:9px;background:var(--roxo-cl);color:var(--roxo);
  display:grid;place-items:center;flex:none}
.msg-av svg{width:17px;height:17px;stroke-width:2}
.msg-ia .balao p{margin-bottom:8px}
.msg-ia .balao p:last-child{margin-bottom:0}
.msg-ia .balao h4{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--cinza-2);margin:14px 0 5px}
.msg-ia .balao h4:first-child{margin-top:0}

.cursor{display:inline-block;width:2px;height:1em;background:var(--marinho);
  vertical-align:-2px;margin-left:2px;animation:pisca 1s step-end infinite}
@keyframes pisca{50%{opacity:0}}
.pontinhos{display:inline-flex;gap:4px;padding:3px 0}
.pontinhos i{width:6px;height:6px;border-radius:50%;background:var(--cinza-2);
  animation:pula 1.2s ease-in-out infinite}
.pontinhos i:nth-child(2){animation-delay:.16s}
.pontinhos i:nth-child(3){animation-delay:.32s}
@keyframes pula{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.buscando{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--azul);
  background:var(--azul-cl);border-radius:8px;padding:6px 10px;margin-bottom:10px}
.buscando svg{width:14px;height:14px;stroke-width:2;flex:none}

.chat-vazio{margin:auto;text-align:center;display:grid;gap:8px;justify-items:center;
  max-width:440px;padding:20px 0}
.chat-vazio b{font-size:16px;font-weight:600;margin-top:6px}
.chat-vazio>span{font-size:13.5px;color:var(--cinza);line-height:1.5}
.chat-vazio .atalhos{margin-top:12px;width:100%}

.escrever{display:flex;align-items:flex-end;gap:8px;border:1.5px solid var(--linha);
  border-radius:14px;padding:7px 8px 7px 14px;background:var(--branco);transition:border-color .14s}
.escrever:focus-within{border-color:var(--ouro-2)}
.escrever textarea{flex:1;border:0;outline:none;resize:none;font-size:14.5px;line-height:1.5;
  padding:7px 0;max-height:170px;background:transparent}
.bt-voz,.bt-enviar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.bt-voz{color:var(--cinza)}
.bt-voz:hover{background:var(--linha-2);color:var(--texto)}
.bt-voz svg,.bt-enviar svg{width:18px;height:18px;stroke-width:2}
.bt-voz.ouvindo{background:var(--vermelho);color:#fff;animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 6px rgba(179,38,30,.16)}}
.bt-enviar{background:var(--ouro);color:#20180A}
.bt-enviar:hover{filter:brightness(1.08)}
.chat-dica{font-size:11.5px;color:var(--cinza-2);margin-top:7px;text-align:center}
.linha-item.aberta{background:var(--linha-2)}

/* ---- próximo passo depois de ler ---- */
.proximo{margin-top:20px;padding-top:18px;border-top:1px solid var(--linha)}
.proximo-t{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--cinza-2);margin-bottom:11px}
.proximo-t svg{width:14px;height:14px;stroke-width:2.4}
.proximo-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.passo{display:grid;gap:3px;padding:13px;border:1px solid var(--linha);border-radius:11px;
  text-align:left;transition:border-color .14s,box-shadow .14s,transform .14s}
.passo:hover:not(:disabled){border-color:var(--ouro-2);box-shadow:var(--sombra-2);transform:translateY(-1px)}
.passo:disabled{opacity:.55;cursor:not-allowed}
.passo .icone-cx{margin-bottom:4px}
.passo b{font-size:13.5px;font-weight:600}
.passo span:not(.icone-cx){font-size:12px;color:var(--cinza);line-height:1.35}

@media (max-width:1100px){
  .chat-grade{grid-template-columns:1fr}
  .chat{height:auto;min-height:520px}
}

/* ======================== WHATSAPP ======================== */
.wpp-grade{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr) minmax(0,310px);
  gap:14px;align-items:start}
.wpp-grade>*{min-width:0}
.wpp-lista,.wpp-chat{height:calc(100vh - 190px);min-height:480px;display:flex;flex-direction:column}
.wpp-lista .bloco-cab{flex:none}
.wpp-busca{padding:0 14px 12px;flex:none}
.wpp-rolagem{flex:1;overflow-y:auto}
.wpp-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 14px;border-top:1px solid var(--linha-2);transition:background .12s}
.wpp-item:first-child{border-top:0}
.wpp-item:hover{background:var(--linha-2)}
.wpp-item.aberta{background:#EEF2F8;box-shadow:inset 3px 0 0 var(--marinho)}
.wpp-av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:var(--linha-2)}
.wpp-av-txt{display:grid;place-items:center;font-size:14px;font-weight:700;
  background:var(--marinho-4);color:var(--ouro)}
.bolinha{min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--verde);
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

.wpp-chat .bloco-cab{gap:11px;flex:none}
.wpp-chat .bloco-cab .wpp-av{width:36px;height:36px}
.wpp-balao{position:relative;padding-bottom:18px}
.msg-eu .wpp-balao{background:#DCF3D8;color:var(--texto);border:1px solid #C6E7C0;
  white-space:pre-wrap}
.msg-ia .wpp-balao{white-space:pre-wrap}
.msg-hora{position:absolute;right:11px;bottom:5px;font-size:10.5px;opacity:.55}
/* no WhatsApp a bolha de quem chega nao tem avatar de robo */
.wpp-chat .msg-ia .msg-av{display:none}
.wpp-chat .msg-ia .balao{max-width:76%}

.wpp-ficha{position:sticky;top:82px}

.parear{max-width:520px;margin:8px auto 0}
.nota-numero{display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:12.5px;color:var(--cinza-2);padding:0 20px 20px;text-align:center}
.nota-numero svg{width:14px;height:14px;stroke-width:2;flex:none}
.qr-cx{display:grid;justify-items:center;text-align:center;gap:16px;padding:26px 22px 24px}
.qr{border:1px solid var(--linha);border-radius:14px;background:#fff;padding:10px;
  width:280px;height:280px}
.passos-qr{text-align:left;font-size:13.5px;line-height:1.6;color:var(--cinza);
  padding-left:20px;max-width:340px}
.passos-qr b{color:var(--texto)}
.qr-espera{display:grid;justify-items:center;gap:9px;padding:44px 10px;max-width:340px}
.qr-espera b{font-size:15px}
.qr-espera span:not(.girando){font-size:13.5px;color:var(--cinza);line-height:1.5}

@media (max-width:1400px){
  .wpp-grade{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
  .wpp-ficha{grid-column:1 / -1;position:static}
}
@media (max-width:900px){
  .wpp-grade{grid-template-columns:1fr}
  .wpp-lista,.wpp-chat{height:auto;max-height:520px}
}

/* ======================== DETALHE ======================== */
.voltar{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--cinza);
  margin-bottom:14px;padding:5px 9px;border-radius:8px}
.voltar:hover{background:var(--linha-2);color:var(--texto)}
.voltar svg{width:15px;height:15px;stroke-width:2}
.cab-caso{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.cab-caso h1{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.cab-caso .sub{font-size:13.5px;color:var(--cinza);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.cab-caso .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.linhas{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13.5px}
.linhas dt{color:var(--cinza);white-space:nowrap}
.linhas dd{white-space:pre-wrap;min-width:0}
ul.itens{list-style:none;display:grid;gap:5px;font-size:13.5px}
ul.itens li{padding-left:15px;position:relative}
ul.itens li::before{content:'';position:absolute;left:1px;top:.6em;width:5px;height:5px;
  border-radius:50%;background:var(--ouro-2)}
.bloco-corpo h4{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--cinza-2);margin:16px 0 6px}
.bloco-corpo h4:first-child{margin-top:0}

.prazo-n{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em}
.prazo-b{height:8px;border-radius:99px;background:var(--linha-2);overflow:hidden;margin:11px 0 8px}
.prazo-b i{display:block;height:100%;border-radius:99px;background:var(--verde)}
[data-a="atencao"] .prazo-b i{background:var(--ouro-2)}
[data-a="atencao"] .prazo-n{color:var(--ambar)}
[data-a="critico"] .prazo-b i,[data-a="prescrito"] .prazo-b i{background:var(--vermelho)}
[data-a="critico"] .prazo-n,[data-a="prescrito"] .prazo-n{color:var(--vermelho)}

.rascunho{background:var(--fundo);border:1px solid var(--linha);border-radius:10px;
  padding:13px;white-space:pre-wrap;font-size:13.5px;line-height:1.55}
.uso{font-size:11.5px;color:var(--cinza-2);margin-top:10px;line-height:1.45}
.girando{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:gira .7s linear infinite}
.bt-fino .girando{border-color:rgba(22,41,74,.25);border-top-color:var(--marinho)}
@keyframes gira{to{transform:rotate(360deg)}}

.trilha{position:relative;padding-left:22px}
.trilha::before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--linha)}
.trilha-i{position:relative;padding:0 0 15px}
.trilha-i:last-child{padding-bottom:0}
.trilha-i::before{content:'';position:absolute;left:-21px;top:5px;width:8px;height:8px;
  border-radius:50%;background:var(--ouro-2);box-shadow:0 0 0 3px var(--branco)}
.trilha-q{font-size:11.5px;color:var(--cinza-2);margin-bottom:1px}
.trilha-t{font-size:13.5px}

.tarefa-l{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--linha-2)}
.tarefa-l:first-child{border-top:0}
.marca{width:18px;height:18px;border:1.8px solid var(--linha);border-radius:5px;flex:none;
  margin-top:2px;display:grid;place-items:center;background:var(--branco);transition:all .14s}
.marca svg{width:11px;height:11px;stroke-width:3;color:#fff;opacity:0}
.tarefa-l.feita .marca{background:var(--verde);border-color:var(--verde)}
.tarefa-l.feita .marca svg{opacity:1}
.tarefa-l.feita .tarefa-t{text-decoration:line-through;color:var(--cinza-2)}
.tarefa-t{font-size:13.5px;font-weight:500}
.tarefa-q{font-size:12px;color:var(--cinza)}

/* publicação do CNJ */
.pub-txt{font-size:12.5px;line-height:1.6;color:var(--cinza);max-height:78px;overflow:hidden;
  position:relative;white-space:pre-wrap}
.pub-txt.aberta{max-height:none}
.pub-txt:not(.aberta)::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34px;
  background:linear-gradient(transparent,var(--branco))}

/* modal */
.fundo-modal{position:fixed;inset:0;z-index:60;background:rgba(15,30,56,.5);
  backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px}
.modal{width:100%;max-width:470px;background:var(--branco);border-radius:16px;
  box-shadow:0 30px 90px rgba(0,0,0,.32);max-height:90vh;overflow-y:auto}
.modal-cab{display:flex;align-items:center;padding:17px 20px;border-bottom:1px solid var(--linha-2)}
.modal-cab h2{font-size:16px;font-weight:600}
.bt-x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--cinza)}
.bt-x:hover{background:var(--linha-2)}
.bt-x svg{width:16px;height:16px;stroke-width:2.2}
.modal-corpo{padding:20px}
.modal-pe{display:flex;gap:9px;justify-content:flex-end;padding:0 20px 20px}

.aviso{display:flex;gap:11px;padding:13px 15px;border-radius:11px;background:var(--ambar-cl);
  font-size:13px;line-height:1.5;color:#5C3D00;margin-bottom:14px}
.aviso svg{width:17px;height:17px;stroke-width:2;flex:none;margin-top:1px;color:var(--ambar)}

.salvo{font-size:12.5px;color:var(--verde);font-weight:600;opacity:0;transition:opacity .2s}
.salvo.ver{opacity:1}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.acoes{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

@media (max-width:1100px){
  .g-2,.g-2b{grid-template-columns:1fr}
}
@media (max-width:860px){
  :root{--lado:0px}
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:70;height:100%;
    transform:translateX(-100%);transition:transform .22s ease}
  .lateral.aberta{transform:none}
  .capa-lado{position:fixed;inset:0;z-index:65;background:rgba(15,30,56,.5)}
  .bt-menu{display:grid !important}
  .conteudo{padding:16px 14px 60px}
  .topo{padding:0 14px;gap:10px}
  .topo h1{font-size:17px}
  .busca-cx{max-width:none}
  .dupla{grid-template-columns:1fr}
  .cal-c{min-height:70px}
  .kpi-n{font-size:27px}
}
.bt-menu{display:none;width:36px;height:36px;border-radius:9px;place-items:center;color:var(--cinza)}
.bt-menu svg{width:20px;height:20px;stroke-width:2}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<script>
(function(){
'use strict';

var URL_SB = '{{SUPABASE_URL}}'.replace(/\/+$/, ''),
    ANON   = '{{SUPABASE_ANON}}',
    WPP    = '{{WPP}}',
    ADV    = '{{ADV}}',
    OAB_N  = '{{OAB}}';

/* ===================================================================
   Vocabulário do escritório. A ordem aqui é a ordem da esteira.
   =================================================================== */
var ETAPAS = [
  ['triagem',     'Triagem',      '#8792A3'],
  ['viabilidade', 'Viabilidade',  '#1F5FA8'],
  ['documentos',  'Documentos',   '#8A5A00'],
  ['contrato',    'Contrato',     '#5B4B9E'],
  ['protocolado', 'Protocolado',  '#22406E'],
  ['andamento',   'Em andamento', '#1F7A4D'],
  ['desfecho',    'Desfecho',     '#0F766E'],
  ['encerrado',   'Encerrado',    '#5E6A7D'],
  ['descartado',  'Descartado',   '#B3261E']
];
var ETAPA_MAPA = {};
ETAPAS.forEach(function(e){ ETAPA_MAPA[e[0]] = {rotulo:e[1], cor:e[2]}; });
function rotEtapa(e){ return (ETAPA_MAPA[e] || {}).rotulo || e; }
function corEtapa(e){ return (ETAPA_MAPA[e] || {}).cor || '#8792A3'; }

/* Cor por área. A coluna diz em que pé está; a cor diz do que se trata —
   assim o quadro se lê de longe sem precisar ler nome por nome. */
var COR_AREA = {
  'Trabalhista':         '#22406E',
  'Previdenciário':      '#C99A3E',
  'Não sei classificar': '#8792A3'
};
function corArea(a){ return COR_AREA[a] || '#8792A3'; }

var VIAB = {
  provavel:     ['Provável',   'tag-verde'],
  possivel:     ['Possível',   'tag-ambar'],
  improvavel:   ['Improvável', 'tag-vermelho'],
  fora_da_area: ['Fora da área','tag-vermelho']
};
var TIPO_TAREFA = {
  audiencia: ['Audiência', 'ev-audiencia', 'var(--vermelho)', 'var(--vermelho-cl)'],
  prazo:     ['Prazo',     'ev-prazo',     'var(--ambar)',    'var(--ambar-cl)'],
  reuniao:   ['Reunião',   'ev-reuniao',   'var(--roxo)',     'var(--roxo-cl)'],
  tarefa:    ['Tarefa',    'ev-tarefa',    'var(--azul)',     'var(--azul-cl)']
};
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho',
             'agosto','setembro','outubro','novembro','dezembro'];

/* ---------- utilitários ---------- */
var $ = function(id){ return document.getElementById(id); };
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function ico(nome, extra){
  return '<svg viewBox="0 0 24 24"' + (extra || '') + '><use href="#i-' + nome + '"/></svg>';
}
function data(iso){
  if(!iso) return '—';
  var d = new Date(String(iso).length <= 10 ? iso + 'T00:00:00' : iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function dataCurta(iso){
  if(!iso) return '—';
  var d = new Date(String(iso).length <= 10 ? iso + 'T00:00:00' : iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
}
function hora(iso){
  return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function dataHora(iso){
  if(!iso) return '—';
  return dataCurta(iso) + ' · ' + hora(iso);
}
function desde(iso){
  var dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if(dias <= 0) return 'hoje';
  if(dias === 1) return 'ontem';
  if(dias < 30)  return 'há ' + dias + ' dias';
  var m = Math.floor(dias/30);
  return 'há ' + m + (m === 1 ? ' mês' : ' meses');
}
function ateQuando(iso){
  var dia = new Date(String(iso).length <= 10 ? iso + 'T00:00:00' : iso),
      hoje = new Date(); hoje.setHours(0,0,0,0);
  var d = Math.round((new Date(dia.getFullYear(),dia.getMonth(),dia.getDate()) - hoje) / 86400000);
  if(d === 0) return 'hoje';
  if(d === 1) return 'amanhã';
  if(d === -1) return 'ontem';
  if(d < 0) return 'há ' + (-d) + ' dias';
  return 'em ' + d + ' dias';
}
function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
function zap(numero, texto){
  var n = String(numero || '').replace(/\D/g,'');
  if(n.length <= 11) n = '55' + n;
  return 'https://wa.me/' + n + (texto ? '?text=' + encodeURIComponent(texto) : '');
}
function primeiro(nome){ return String(nome || '').trim().split(/\s+/)[0] || ''; }
function iniciais(s){
  var p = String(s || '').trim().split(/[\s@.]+/).filter(Boolean);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[1][0] : '')).toUpperCase();
}

/* ===================================================================
   Sessão
   =================================================================== */
var sessao = null;
try{ sessao = JSON.parse(localStorage.getItem('sena_sessao') || 'null'); }catch(e){}
function guardaSessao(s){ sessao = s; try{ localStorage.setItem('sena_sessao', JSON.stringify(s)); }catch(e){} }
function limpaSessao(){ sessao = null; try{ localStorage.removeItem('sena_sessao'); }catch(e){} }

function entrar(email, senha){
  return fetch(URL_SB + '/auth/v1/token?grant_type=password', {
    method:'POST', headers:{'apikey':ANON,'Content-Type':'application/json'},
    body: JSON.stringify({email:email, password:senha})
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Não foi possível entrar.');
      guardaSessao(j); return j;
    });
  });
}
function renova(){
  if(!sessao || !sessao.refresh_token) return Promise.reject(new Error('sem sessão'));
  return fetch(URL_SB + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST', headers:{'apikey':ANON,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: sessao.refresh_token})
  }).then(function(r){
    if(!r.ok) throw new Error('sessão expirada');
    return r.json().then(guardaSessao);
  });
}
function api(caminho, opcoes, jaTentou){
  opcoes = opcoes || {};
  var h = Object.assign({
    'apikey': ANON,
    'Authorization': 'Bearer ' + (sessao ? sessao.access_token : ''),
    'Content-Type': 'application/json'
  }, opcoes.headers || {});
  return fetch(URL_SB + caminho, Object.assign({}, opcoes, {headers:h})).then(function(r){
    if(r.status === 401 && !jaTentou){
      return renova().then(function(){ return api(caminho, opcoes, true); },
                           function(){ sair(); throw new Error('sessão expirada'); });
    }
    if(r.status === 204) return null;
    return r.text().then(function(t){
      var j = null;
      if(t){ try{ j = JSON.parse(t); }catch(e){ j = {mensagem:t}; } }
      if(!r.ok) throw new Error((j && (j.message || j.erro || j.mensagem)) || ('erro ' + r.status));
      return j;
    });
  });
}

/* ===================================================================
   Estado
   =================================================================== */
var E = {
  casos:[], movs:[], tarefas:[], pubs:[], processos:[],
  vista:'painel', casoId:null, busca:'', filtro:null,
  modo:'quadro',      /* esteira: quadro ou lista — mesma coisa, vista diferente */
  area:'',            /* filtro por área */
  mesRef:new Date(), diaSel:null,
  processoAberto:null,
  docs:[], conversas:[], msgs:[],
  conversaId:null, conversaCtx:{},
  assist:'perguntar',   /* aba da assistente */
  casoCtx:null,         /* caso que ele estava vendo antes de perguntar */
  ultimaAnalise:null, docAtual:null,
  /* whatsapp */
  wpp:{sessao:null, caixa:[], msgs:[], abertaId:null, busca:'', editando:false}
};

function ativo(c){ return c.etapa !== 'encerrado' && c.etapa !== 'descartado'; }
function acha(id){ for(var i=0;i<E.casos.length;i++) if(E.casos[i].id === id) return E.casos[i]; return null; }
function tarefasDe(id){ return E.tarefas.filter(function(t){ return t.caso_id === id; }); }
function movsDe(id){ return E.movs.filter(function(m){ return m.caso_id === id; }); }

function carrega(){
  return Promise.all([
    api('/rest/v1/casos_com_prazo?select=*&order=criado_at.desc'),
    api('/rest/v1/movimentacoes?select=*&order=criado_at.desc&limit=300'),
    api('/rest/v1/tarefas?select=*&order=quando.asc&limit=500'),
    api('/rest/v1/publicacoes?select=*&order=disponibilizada.desc&limit=400'),
    api('/rest/v1/processos_oab?select=*&order=ultima.desc'),
    api('/rest/v1/documentos?select=*&order=criado_at.desc&limit=100'),
    api('/rest/v1/conversas?select=*&order=mexida_at.desc&limit=40'),
    api('/rest/v1/wpp_sessao?select=*&id=eq.1'),
    api('/rest/v1/wpp_caixa?select=*&order=ultima_at.desc&limit=200')
  ]).then(function(r){
    E.casos = r[0] || []; E.movs = r[1] || []; E.tarefas = r[2] || [];
    E.pubs  = r[3] || []; E.processos = r[4] || [];
    E.docs  = r[5] || []; E.conversas = r[6] || [];
    E.wpp.sessao = (r[7] || [])[0] || null;
    E.wpp.caixa  = r[8] || [];
  });
}

/* alertas: o que realmente exige ação hoje */
function alertas(){
  var lista = [], hoje = new Date(); hoje.setHours(23,59,59,999);
  E.casos.filter(ativo).forEach(function(c){
    if(c.alerta_prazo === 'prescrito')
      lista.push({t:'Prazo vencido', s:c.nome + ' — prescreveu em ' + data(c.prescreve_em), id:c.id, g:'vermelho'});
    else if(c.alerta_prazo === 'critico')
      lista.push({t:c.dias_restantes + ' dias pra prescrever', s:c.nome, id:c.id, g:'vermelho'});
  });
  E.tarefas.filter(function(t){ return !t.feita && new Date(t.quando) <= hoje; })
    .forEach(function(t){
      var c = acha(t.caso_id);
      lista.push({t:t.titulo, s:(c ? c.nome + ' — ' : '') + ateQuando(t.quando), id:t.caso_id, g:'ambar'});
    });
  var naoLidas = E.pubs.filter(function(p){ return !p.lida; }).length;
  if(naoLidas) lista.push({t:naoLidas + ' publicação' + (naoLidas>1?'ões':'') + ' sem ler', s:'Diário de Justiça', v:'publicacoes', g:'azul'});
  return lista;
}

/* ===================================================================
   Navegação
   =================================================================== */
var TITULOS = {painel:'Painel', esteira:'Casos', agenda:'Agenda',
               assistente:'Assistente', whatsapp:'WhatsApp',
               processos:'Meus processos', caso:'Caso'};

function vai(vista, id){
  E.vista = vista; E.casoId = id || null;
  location.hash = vista === 'caso' ? '#caso/' + id : '#' + vista;
  pinta();
}
function daHash(){
  var h = location.hash.replace(/^#/,'');
  if(h.indexOf('caso/') === 0){ E.vista = 'caso'; E.casoId = h.slice(5); }
  else if(h === 'casos'){ E.vista = 'esteira'; E.modo = 'lista'; E.casoId = null; }
  else if(h === 'publicacoes'){ E.vista = 'processos'; E.casoId = null; }
  else if(TITULOS[h]){ E.vista = h; E.casoId = null; }
}
window.addEventListener('hashchange', function(){ daHash(); pinta(); });

function pinta(){
  $('tituloPagina').textContent = TITULOS[E.vista] || 'Painel';
  [].forEach.call($('nav').querySelectorAll('a'), function(a){
    if(a.dataset.v === E.vista) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  var naoLidas = E.pubs.filter(function(p){ return !p.lida; }).length;
  $('selPub').textContent = naoLidas;
  $('selPub').classList.toggle('oculto', !naoLidas);
  var wnl = E.wpp.caixa.reduce(function(t,c){ return t + (c.nao_lidas||0); }, 0);
  $('selWpp').textContent = wnl > 99 ? '99+' : wnl;
  $('selWpp').classList.toggle('oculto', !wnl);
  var n = alertas().length;
  $('sinoN').textContent = n > 9 ? '9+' : n;
  $('sinoN').classList.toggle('oculto', !n);

  var c = $('conteudo');
  if(E.vista === 'esteira')        c.innerHTML = vistaEsteira();
  else if(E.vista === 'agenda')    c.innerHTML = vistaAgenda();
  else if(E.vista === 'assistente') c.innerHTML = vistaAssistente();
  else if(E.vista === 'whatsapp')   c.innerHTML = vistaWhatsapp();
  else if(E.vista === 'processos') c.innerHTML = vistaProcessos();
  else if(E.vista === 'caso')      c.innerHTML = vistaCaso();
  else                             c.innerHTML = vistaPainel();
  c.scrollTop = 0;
  if(E.vista === 'esteira' && E.modo === 'quadro') ligaArrastar();
  vigiaSessaoWpp();
}

/* ===================================================================
   VISTA: Painel
   =================================================================== */
function vistaPainel(){
  var abertos  = E.casos.filter(ativo),
      triagem  = E.casos.filter(function(c){ return c.etapa === 'triagem'; }),
      criticos = abertos.filter(function(c){ return c.alerta_prazo === 'critico' || c.alerta_prazo === 'prescrito'; }),
      atencao  = abertos.filter(function(c){ return c.alerta_prazo === 'atencao'; }),
      semana   = E.casos.filter(function(c){ return (Date.now() - new Date(c.criado_at)) < 7*86400000; }),
      semData  = abertos.filter(function(c){ return !c.data_saida && c.area === 'Trabalhista'; });

  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var proximas = E.tarefas.filter(function(t){ return !t.feita; })
    .sort(function(a,b){ return new Date(a.quando) - new Date(b.quando); }).slice(0,6);

  /* casos por etapa */
  var conta = {}; E.casos.forEach(function(c){ conta[c.etapa] = (conta[c.etapa]||0)+1; });
  var maior = Math.max.apply(null, ETAPAS.map(function(e){ return conta[e[0]] || 0; }).concat([1]));
  var barras = ETAPAS.filter(function(e){ return conta[e[0]]; }).map(function(e){
    return '<div class="barra"><span class="barra-t">' + e[1] + '</span>' +
      '<span class="barra-r"><i style="width:' + ((conta[e[0]]/maior)*100) + '%;background:' + e[2] + '"></i></span>' +
      '<span class="barra-n num">' + conta[e[0]] + '</span></div>';
  }).join('');

  /* por área */
  var areas = {}; abertos.forEach(function(c){ areas[c.area] = (areas[c.area]||0)+1; });
  var coresArea = {'Trabalhista':'#22406E','Previdenciário':'#E0B959','Não sei classificar':'#8792A3'};

  /* entradas por semana, 8 semanas */
  var sem = [];
  for(var i = 7; i >= 0; i--){
    var fim = new Date(hoje.getTime() - i*7*86400000),
        ini = new Date(fim.getTime() - 7*86400000);
    sem.push({
      n: E.casos.filter(function(c){ var t = new Date(c.criado_at); return t > ini && t <= fim; }).length,
      r: dataCurta(ymd(ini))
    });
  }
  var maiorSem = Math.max.apply(null, sem.map(function(s){ return s.n; }).concat([1]));

  var recentes = E.movs.slice(0,6);

  return '' +
  '<div class="kpis">' +
    kpi('pasta',   'Casos em aberto', abertos.length, 'de ' + E.casos.length + ' no total', 'esteira') +
    kpi('entrada', 'Aguardando triagem', triagem.length, triagem.length ? 'o mais antigo ' + desde(triagem[triagem.length-1].criado_at) : 'fila limpa', 'esteira') +
    kpi('alerta',  'Prazo crítico', criticos.length, 'menos de 90 dias', 'criticos', criticos.length > 0) +
    kpi('relogio', 'Prazo em atenção', atencao.length, 'entre 90 e 180 dias', 'esteira') +
    kpi('pessoa',  'Entraram na semana', semana.length, 'últimos 7 dias', 'esteira') +
    kpi('agenda',  'Compromissos abertos', E.tarefas.filter(function(t){ return !t.feita; }).length, 'prazos e audiências', 'agenda') +
  '</div>' +

  (semData.length ? '<div class="aviso">' + ico('alerta') +
    '<div><b>' + semData.length + ' caso' + (semData.length>1?'s trabalhistas':' trabalhista') +
    ' sem data de saída.</b> Sem o fim do contrato não dá pra contar a prescrição — ' +
    'confirme com o cliente e preencha na ficha.</div></div>' : '') +

  '<div class="grade g-2" style="margin-bottom:14px">' +
    '<div class="bloco">' +

function rosca(dados, cores, total){
  var chaves = Object.keys(dados), raio = 60, circ = 2 * Math.PI * raio, off = 0;
  var arcos = chaves.map(function(k){
    var frac = dados[k] / total, comp = frac * circ,
        s = '<circle cx="75" cy="75" r="' + raio + '" fill="none" stroke="' + (cores[k] || '#8792A3') +
            '" stroke-width="19" stroke-dasharray="' + comp + ' ' + (circ - comp) +
            '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 75 75)"/>';
    off += comp; return s;
  }).join('');
  return '<div class="rosca-cx"><div class="rosca">' +
    '<svg viewBox="0 0 150 150" width="150" height="150">' + arcos + '</svg>' +
    '<div class="rosca-meio"><b class="num">' + total + '</b><span>em aberto</span></div></div>' +
    '<div class="legenda">' + chaves.map(function(k){
      return '<div><i style="background:' + (cores[k] || '#8792A3') + '"></i>' +
        esc(k) + ' <b class="num" style="margin-left:2px">' + dados[k] + '</b></div>';
    }).join('') + '</div></div>';
}

function filtraCasos(){
  var t = E.busca.trim().toLowerCase();
  return E.casos.filter(function(c){
    if(E.area && c.area !== E.area) return false;
    if(E.filtro === 'criticos' && !(c.alerta_prazo === 'critico' || c.alerta_prazo === 'prescrito')) return false;
    if(!t) return true;
    return ((c.nome||'') + ' ' + (c.cidade||'') + ' ' + (c.whatsapp||'')).toLowerCase().indexOf(t) > -1;
  });
}

   de dois jeitos, então o filtro e a contagem também são os mesmos. */

function cartao(c){
  var ia = c.ia && VIAB[c.ia.viabilidade],
      pend = tarefasDe(c.id).filter(function(t){ return !t.feita; }).length,
      barra = '';
  if(c.data_saida){
    var pct = Math.max(2, Math.min(100, (c.dias_restantes / 730) * 100)),
        cor = c.dias_restantes < 0 || c.dias_restantes <= 90 ? 'var(--vermelho)'
            : c.dias_restantes <= 180 ? 'var(--ouro-2)' : 'var(--verde)';
    barra = '<span class="cartao-b"><i style="width:' + pct + '%;background:' + cor + '"></i></span>';
  }
  /* clicável de verdade: é <button>, abre no Enter e no toque.
     O arrastar continua funcionando — quem separa os dois é o
     guarda de distância no ligaArrastar(). */
  return '<button type="button" class="cartao" draggable="true" data-id="' + c.id + '"' +
    ' data-caso="' + c.id + '" style="border-left:3px solid ' + corArea(c.area) + '">' +
    '<span class="cartao-n">' + esc(c.nome) + '</span>' +
    '<span class="cartao-s"><span class="ponto" style="color:' + corArea(c.area) + '"></span>' +
      esc(c.area) + (c.cidade ? ' · ' + esc(c.cidade) : '') + '</span>' +
    barra +
    '<span class="cartao-r">' +
      selo(c) +
      (ia ? '<span class="tag ' + ia[1] + '">' + ia[0] + '</span>' : '') +
      (pend ? '<span class="tag tag-ambar">' + pend + ' pendência' + (pend>1?'s':'') + '</span>' : '') +
    '</span></button>';
}

function selo(c){
  if(c.alerta_prazo === 'prescrito') return '<span class="tag tag-vermelho">Prazo vencido</span>';
  if(c.alerta_prazo === 'critico')   return '<span class="tag tag-vermelho">' + c.dias_restantes + ' dias</span>';
  if(c.alerta_prazo === 'atencao')   return '<span class="tag tag-ambar">' + c.dias_restantes + ' dias</span>';
  if(!c.data_saida && c.area === 'Trabalhista') return '<span class="tag">sem data</span>';
  return '';
}

/* arrastar entre colunas */
function ligaArrastar(){
  var pegando = null;
  [].forEach.call(document.querySelectorAll('.cartao'), function(el){
    el.addEventListener('dragstart', function(e){
      pegando = el; el.classList.add('arrastando');
      /* marca o cartão: o clique que o navegador dispara no fim do
         arrasto seria lido como "abrir o caso" e tiraria o Gildemi
         da esteira toda vez que ele movesse alguém */
      el.dataset.arrastou = '1';
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', el.dataset.id); }catch(x){}
    });
    el.addEventListener('dragend', function(){
      el.classList.remove('arrastando'); pegando = null;
      setTimeout(function(){ delete el.dataset.arrastou; }, 60);
      [].forEach.call(document.querySelectorAll('.coluna'), function(k){ k.classList.remove('alvo'); });
    });
  });
  [].forEach.call(document.querySelectorAll('.coluna'), function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('alvo'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('alvo'); });
    col.addEventListener('drop', function(e){
      e.preventDefault(); col.classList.remove('alvo');
      var id = pegando ? pegando.dataset.id : (e.dataTransfer.getData('text/plain') || ''),
          c = acha(id), nova = col.dataset.etapa;
      if(!c || c.etapa === nova) return;
      var antes = c.etapa;
      c.etapa = nova; pinta();                       /* mexe na hora, confirma depois */
      api('/rest/v1/casos?id=eq.' + id, {
        method:'PATCH', headers:{'Prefer':'return=minimal'},
        body: JSON.stringify({etapa:nova})
      })
      .then(function(){
        return api('/rest/v1/movimentacoes', {
          method:'POST', headers:{'Prefer':'return=minimal'},
          body: JSON.stringify({caso_id:id, tipo:'etapa',
            texto:'Etapa alterada de ' + rotEtapa(antes) + ' para ' + rotEtapa(nova)})
        });
      })
      .then(carrega).then(pinta)
      .catch(function(err){ c.etapa = antes; pinta(); alert('Não deu pra mover: ' + err.message); });
    });
  });
}

function eventosDoMes(){
  var mapa = {};
  function poe(dia, ev){ (mapa[dia] = mapa[dia] || []).push(ev); }
  E.tarefas.forEach(function(t){
    /* a data local é o que vale na agenda: um compromisso das 21h de
       sexta não pode aparecer no sábado só porque o ISO virou o dia */
    poe(ymd(new Date(t.quando)), {
      tipo: t.tipo || 'tarefa', titulo: t.titulo, caso: t.caso_id,
      hora: hora(t.quando), feita: t.feita, id: t.id
    });
  });
  /* a prescrição é um compromisso mesmo que ninguém tenha marcado */
  E.casos.filter(function(c){ return ativo(c) && c.prescreve_em; }).forEach(function(c){
    poe(c.prescreve_em, {tipo:'prescricao', titulo:'Prescreve · ' + primeiro(c.nome), caso:c.id});
  });
  return mapa;
}

  var partes = p.partes || [];
  for(var i = 0; i < partes.length; i++){

/* markdown mínimo: é o que a IA usa e o que dá pra ler */
function textoRico(t){
  var linhas = String(t || '').split('\n'), saida = '', naLista = false;
  linhas.forEach(function(l){
    var neg = esc(l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if(/^#{1,4}\s/.test(l)){
      if(naLista){ saida += '</ul>'; naLista = false; }
      saida += '<h4>' + neg.replace(/^#{1,4}\s*/, '') + '</h4>';
    } else if(/^\s*[-•*]\s/.test(l)){
      if(!naLista){ saida += '<ul class="itens">'; naLista = true; }
      saida += '<li>' + neg.replace(/^\s*[-•*]\s*/, '') + '</li>';
    } else {
      if(naLista){ saida += '</ul>'; naLista = false; }
      if(l.trim()) saida += '<p>' + neg + '</p>';
    }
  });
  if(naLista) saida += '</ul>';
  return saida;
}

function telaParear(ses){
  var erro = ses.erro
    ? '<p class="erro" style="margin-bottom:6px">' + esc(ses.erro) + '</p>' : '';

  var meio;
  if(ses.estado === 'qr' && ses.qr){
    meio =
      '<img class="qr" src="' + esc(ses.qr) + '" alt="QR Code para conectar o WhatsApp" ' +
        'width="320" height="320">' +
      '<ol class="passos-qr">' +
        '<li>Abra o WhatsApp no celular</li>' +
        '<li>Toque em <b>Mais opções</b> › <b>Aparelhos conectados</b></li>' +
        '<li>Toque em <b>Conectar aparelho</b></li>' +
        '<li>Aponte a câmera para este código</li>' +
      '</ol>' +
      '<p class="uso">A tela abre sozinha assim que conectar.</p>';
  } else {
    meio =
      '<div class="qr-espera">' +
        '<span class="girando" style="border-color:rgba(22,41,74,.2);' +
          'border-top-color:var(--marinho);width:22px;height:22px"></span>' +
        '<b>Gerando o código</b>' +
        '<span>Só um instante.</span>' +
      '</div>';
  }

  /* Uma tela só, com o código no meio. O aviso sobre o número fica numa
     linha porque quem escaneia é o Gildemi — ele não esteve nas conversas
     em que isso foi combinado. */
  return '<div class="parear">' +
    '<div class="bloco">' +
      '<div class="bloco-cab" style="justify-content:center">' +
        '<h2>Conectar o WhatsApp</h2>' +

function fone(t){
  var d = String(t || '').replace(/\D/g,'');
  if(d.length === 13) return '+' + d.slice(0,2) + ' (' + d.slice(2,4) + ') ' + d.slice(4,9) + '-' + d.slice(9);
  if(d.length === 12) return '+' + d.slice(0,2) + ' (' + d.slice(2,4) + ') ' + d.slice(4,8) + '-' + d.slice(8);
  return t;
}

function prazoKpi(c){
  if(!c.data_saida){
    return '<div class="kpi"><span class="kpi-t">' + ico('relogio') + 'Prescrição</span>' +
      '<span class="kpi-n" style="font-size:19px;padding-top:6px">sem data</span>' +
      '<span class="kpi-s">' + (c.saida ? 'disse: ' + esc(c.saida) : 'preencha o fim do contrato') + '</span></div>';
  }
  var restam = c.dias_restantes,
      pct = Math.max(0, Math.min(100, restam / 730 * 100));
  return '<div class="kpi" data-a="' + esc(c.alerta_prazo) + '">' +
    '<span class="kpi-t">' + ico('relogio') + 'Prescrição bienal</span>' +
    '<span class="prazo-n num">' + (restam < 0 ? 'vencido' : restam + (restam === 1 ? ' dia' : ' dias')) + '</span>' +
    '<span class="prazo-b"><i style="width:' + pct.toFixed(1) + '%"></i></span>' +
    '<span class="kpi-s">' + (restam < 0 ? 'prescreveu em ' : 'prescreve em ') + data(c.prescreve_em) + '</span></div>';
}

function ficha(c){
  var l = [
    ['Situação', c.situacao], ['Tempo desde a saída', c.saida],
    ['O que ficou pra trás', (c.pontos||[]).join(', ')],
    ['Benefício', (c.beneficio||[]).join(', ')], ['No INSS', c.inss],
    ['Documentos que tem', c.documentos], ['Relato', c.relato]
  ].filter(function(p){ return p[1]; });
  if(!l.length) return '<div class="vazio" style="padding:16px">Ficha sem detalhes.</div>';
  return '<dl class="linhas">' + l.map(function(p){
    return '<dt>' + p[0] + '</dt><dd>' + esc(p[1]) + '</dd>';
  }).join('') + '</dl>';
}

/* ===================================================================
   Ações
   =================================================================== */
function salvar(){
  var id = E.casoId, bt = $('btSalva');
  bt.disabled = true; $('erroSalvar').textContent = '';
  api('/rest/v1/casos?id=eq.' + id, {
    method:'PATCH', headers:{'Prefer':'return=minimal'},
    body: JSON.stringify({
      etapa: $('cpEtapa').value,
      data_saida: $('cpData').value || null,
      notas: $('cpNotas').value.trim() || null
    })
  })
  .then(carrega)
  .then(function(){
    pinta();
    var s = $('salvo');
    if(s){ s.classList.add('ver'); setTimeout(function(){ var x = $('salvo'); if(x) x.classList.remove('ver'); }, 1800); }
  })
  .catch(function(e){ var el = $('erroSalvar'); if(el) el.textContent = e.message; if(bt) bt.disabled = false; });
}

function registraMov(){
  var texto = $('cpMov').value.trim();
  if(!texto) return;
  var bt = $('btMov'); bt.disabled = true;
  api('/rest/v1/movimentacoes', {
    method:'POST', headers:{'Prefer':'return=minimal'},
    body: JSON.stringify({caso_id:E.casoId, texto:texto, tipo:'nota'})
  })
  .then(carrega).then(pinta)
  .catch(function(e){ alert('Não deu pra registrar: ' + e.message); if(bt) bt.disabled = false; });
}

function analisa(){
  var id = E.casoId, bt = $('btIA');
  bt.disabled = true; bt.innerHTML = '<span class="girando"></span> Analisando…';
  var el = $('erroIA'); if(el) el.textContent = '';
  api('/functions/v1/triagem', {method:'POST', body: JSON.stringify({caso_id:id})})
    .then(carrega).then(pinta)
    .catch(function(e){
      var b = $('btIA'); if(b){ b.disabled = false; b.textContent = 'Tentar de novo'; }
      var x = $('erroIA'); if(x) x.textContent = e.message;
    });
}

function apaga(){
  var c = acha(E.casoId);
  if(!c || !confirm('Apagar o caso de ' + c.nome + '? Isso não volta.')) return;

/* ---------- ações da assistente ---------- */
function ocupado(bt, texto){
  if(!bt) return;
  bt.disabled = true;
  /* guarda o rótulo só na primeira vez: o envio troca de "Enviando" pra
     "Lendo", e sobrescrever aqui deixaria o botão preso no spinner */
  if(!bt.dataset.antes) bt.dataset.antes = bt.innerHTML;
  bt.innerHTML = '<span class="girando"></span> ' + texto;
}
function livre(bt){
  if(!bt) return;
  bt.disabled = false;
  if(bt.dataset.antes){ bt.innerHTML = bt.dataset.antes; delete bt.dataset.antes; }
}
function erroAssist(msg){
  var el = $('erroAssist'); if(el) el.textContent = msg;
}

/* ---------------------------------------------------------------
   O chat.

   A resposta vem em pedaços (SSE) e é escrita na tela enquanto sai —
   uma pergunta com busca leva de 20 a 60 segundos, e tela parada esse
   tempo todo parece travamento.
--------------------------------------------------------------- */
function rolaFim(){
  var cx = $('chatCorpo');
  if(cx) cx.scrollTop = cx.scrollHeight;
}

function abreConversa(id){
  E.conversaId = id;
  E.msgs = [];
  pinta();
  if(!id) return;
  api('/rest/v1/mensagens?conversa_id=eq.' + id + '&select=*&order=criado_at')
    .then(function(r){
      if(E.conversaId !== id) return;
      E.msgs = (r || []).map(function(m){
        return {papel:m.papel, texto:m.texto, fontes:m.fontes};
      });
      pinta(); rolaFim();
    })
    .catch(function(e){ erroAssist(e.message); });
}

function novaConversa(){
  E.conversaId = null; E.msgs = []; E.conversaCtx = {};
  pinta();
}

/** Cria a conversa no banco na primeira mensagem, não antes. */
function garanteConversa(){
  if(E.conversaId) return Promise.resolve(E.conversaId);
  return api('/rest/v1/conversas', {
    method:'POST', headers:{'Prefer':'return=representation'},
    body: JSON.stringify({
      caso_id: E.conversaCtx.caso || null,
      documento_id: E.conversaCtx.documento || null
    })
  }).then(function(r){ E.conversaId = r[0].id; return E.conversaId; });
}

function pergunta(){
  var cx = $('pergunta'), texto = cx.value.trim();
  if(!texto || E.respondendo) return;
  erroAssist('');
  cx.value = ''; cx.style.height = 'auto';

  E.msgs.push({papel:'user', texto:texto});
  E.msgs.push({papel:'assistant', texto:'', pensando:true});
  E.respondendo = true;
  pinta(); rolaFim();

  garanteConversa()
    .then(function(id){ return conversa(id, texto); })
    .catch(function(e){
      E.msgs.pop();
      E.respondendo = false;
      pinta(); erroAssist(e.message);
    });
}

function conversa(id, texto){
  var atual = E.msgs[E.msgs.length - 1];

  return fetch(URL_SB + '/functions/v1/advogado', {
    method:'POST',
    headers:{
      'apikey': ANON,
      'Authorization': 'Bearer ' + sessao.access_token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({acao:'conversar', conversa_id:id, mensagem:texto})
  })
  .then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(t || ('erro ' + r.status)); });
    if(!r.body) throw new Error('sem resposta do servidor');

    var leitor = r.body.getReader(), dec = new TextDecoder(), sobra = '';

    function passo(){
      return leitor.read().then(function(bloco){
        if(bloco.done) return;
        sobra += dec.decode(bloco.value, {stream:true});

        /* SSE separa eventos por linha em branco */
        var partes = sobra.split('\n\n');
        sobra = partes.pop();

        partes.forEach(function(p){
          var evento = (/^event:\s*(.+)$/m.exec(p) || [])[1],
              dados  = (/^data:\s*(.+)$/m.exec(p) || [])[1];
          if(!evento || !dados) return;
          var d;
          try{ d = JSON.parse(dados); }catch(e){ return; }

          if(evento === 'texto'){
            atual.pensando = false;
            atual.texto += d.t;
            pintaBolhaViva(atual);
          } else if(evento === 'buscando'){
            atual.buscando = d.q || '';
            pintaBolhaViva(atual);
          } else if(evento === 'fim'){
            atual.fontes = d.fontes; atual.uso = d.uso;
            atual.buscando = null; atual.pensando = false;
          } else if(evento === 'erro'){
            throw new Error(d.erro);
          }
        });
        return passo();
      });
    }

    return passo();
  })
  .then(function(){
    E.respondendo = false;
    pinta(); rolaFim();
    return carrega().then(function(){ /* atualiza a lista de conversas */ });
  })
  .catch(function(e){
    E.respondendo = false;
    if(atual && !atual.texto) E.msgs.pop();
    pinta(); erroAssist(e.message);
  });
}

/* Escreve só a última bolha enquanto o texto chega. Repintar a tela
   inteira a cada pedaço perderia o foco e a rolagem. */
function pintaBolhaViva(m){
  var cx = $('chatCorpo');
  if(!cx) return;
  var alvo = cx.querySelector('.msg-ia:last-child .balao');
  if(!alvo) return;
  var perto = cx.scrollHeight - cx.scrollTop - cx.clientHeight < 90;
  alvo.innerHTML = (m.buscando
      ? '<div class="buscando">' + ico('busca') + 'Consultando: ' + esc(m.buscando) + '</div>'
      : '') +
    (m.texto ? textoRico(m.texto) + '<span class="cursor"></span>'
             : '<span class="pontinhos"><i></i><i></i><i></i></span>');
  if(perto) cx.scrollTop = cx.scrollHeight;
}

/* ---------- ditado ---------- */
/* Usa o reconhecimento do próprio navegador: não custa nada, não sobe
   áudio pra lugar nenhum e transcreve em português na hora.
   Chrome e Safari têm; Firefox não. */
var Ouvinte = window.SpeechRecognition || window.webkitSpeechRecognition,
    ouvindo = null;

function alternaVoz(){
  var bt = $('btVoz'), cx = $('pergunta'), dica = $('chatDica');
  if(!Ouvinte){
    erroAssist('Este navegador não tem ditado. Use o Chrome ou o Safari.');
    return;
  }
  if(ouvindo){ ouvindo.stop(); return; }

  var r = new Ouvinte();
  r.lang = 'pt-BR';
  r.continuous = true;
  r.interimResults = true;

  var jaFirmado = cx.value ? cx.value + ' ' : '';

  r.onstart = function(){
    ouvindo = r;
    bt.classList.add('ouvindo');
    bt.innerHTML = ico('parar');
    if(dica) dica.textContent = 'Pode falar. Aperte de novo pra parar.';
  };
  r.onresult = function(e){
    var firme = '', voando = '';
    for(var i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) firme += e.results[i][0].transcript;
      else voando += e.results[i][0].transcript;
    }
    if(firme) jaFirmado += firme + ' ';
    cx.value = jaFirmado + voando;
    ajustaAltura(cx);
  };
  r.onerror = function(e){
    erroAssist(e.error === 'not-allowed'
      ? 'Precisa liberar o microfone pro site.'
      : 'Não deu pra ouvir: ' + e.error);
  };
  r.onend = function(){
    ouvindo = null;
    var b = $('btVoz');
    if(b){ b.classList.remove('ouvindo'); b.innerHTML = ico('microfone'); }
    var d = $('chatDica');
    if(d) d.textContent = 'Enter envia · Shift+Enter quebra linha';
  };

  try{ r.start(); }catch(e){ erroAssist('Não deu pra iniciar o ditado.'); }
}

/* ===================================================================
   TEMPO REAL

   O Supabase publica cada INSERT/UPDATE num websocket. Em vez de o painel
   ficar perguntando "chegou algo?", o banco avisa — mensagem nova do
   WhatsApp, lead novo do site e publicação nova do Diário aparecem na
   tela sem ninguém apertar nada.

   Protocolo é o do Phoenix: entra num canal, manda batida de coração a
   cada 30s, escuta `postgres_changes`. Se o websocket não subir, cai pra
   uma releitura a cada 20s — melhor lento que parado.
   =================================================================== */
var TR = {ws:null, coracao:null, refazendo:null, ref:0, reserva:null};

function tempoReal(){
  if(!URL_SB || !sessao || TR.ws) return;

  var url = URL_SB.replace(/^http/, 'ws') +
            '/realtime/v1/websocket?apikey=' + encodeURIComponent(ANON) + '&vsn=1.0.0';
  var ws;
  try{ ws = new WebSocket(url); }catch(e){ ligaReserva(); return; }
  TR.ws = ws;

  ws.onopen = function(){
    paraReserva();
    manda('realtime:sena', 'phx_join', {
      config: {
        broadcast: {self: false},
        postgres_changes: [
          {event:'*',      schema:'public', table:'mensagens_wpp'},
          {event:'*',      schema:'public', table:'conversas_wpp'},
          {event:'*',      schema:'public', table:'contatos'},
          {event:'*',      schema:'public', table:'wpp_sessao'},
          {event:'INSERT', schema:'public', table:'casos'},
          {event:'INSERT', schema:'public', table:'publicacoes'},
          {event:'*',      schema:'public', table:'tarefas'}
        ]
      },
      /* sem o token o Realtime aplica o RLS como anônimo e não vem nada */
      access_token: sessao.access_token
    });
    TR.coracao = setInterval(function(){
      manda('phoenix', 'heartbeat', {});
      /* o token vence em 1h; renovar no canal evita cair do nada */
      if(sessao) manda('realtime:sena', 'access_token', {access_token: sessao.access_token});
    }, 30000);
  };

  ws.onmessage = function(ev){
    var m;
    try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.event !== 'postgres_changes') return;
    var d = m.payload && m.payload.data;
    if(d) chegou(d.table, d.type, d.record || d.old_record || {});
  };

  ws.onclose = function(){
    limpaTR();
    ligaReserva();
    /* reconecta com espera crescente pra não martelar o servidor */
    TR.refazendo = setTimeout(tempoReal, 4000);
  };
  ws.onerror = function(){ try{ ws.close(); }catch(e){} };
}

function manda(topico, evento, payload){
  if(!TR.ws || TR.ws.readyState !== 1) return;
  TR.ws.send(JSON.stringify({topic:topico, event:evento, payload:payload, ref:String(++TR.ref)}));
}

function limpaTR(){
  if(TR.coracao){ clearInterval(TR.coracao); TR.coracao = null; }
  if(TR.refazendo){ clearTimeout(TR.refazendo); TR.refazendo = null; }
  TR.ws = null;
}

function desligaTempoReal(){
  var ws = TR.ws;
  limpaTR(); paraReserva();
  if(ws){ try{ ws.onclose = null; ws.close(); }catch(e){} }
}

function ligaReserva(){
  if(TR.reserva) return;
  TR.reserva = setInterval(function(){
    if(document.hidden || digitando()) return;
    carrega().then(function(){
      /* releitura geral nao traz as mensagens da conversa aberta:
         sem isto, a lista anda e a conversa na tela congela */
      if(E.vista === 'whatsapp' && E.wpp.abertaId){
        var id = E.wpp.abertaId;
        return api('/rest/v1/mensagens_wpp?conversa_id=eq.' + id +
                   '&select=*&order=criado_at&limit=300')
          .then(function(r){
            if(E.wpp.abertaId !== id) return;
            if((r || []).length !== E.wpp.msgs.length) E.wpp.msgs = r || [];
            pinta();
            var cx = $('wppCorpo'); if(cx) cx.scrollTop = cx.scrollHeight;
          });
      }
      pinta();
    }).catch(function(){});
  }, 20000);
}
function paraReserva(){
  if(TR.reserva){ clearInterval(TR.reserva); TR.reserva = null; }
}

/* Alguém escrevendo não pode ter a tela puxada embaixo do dedo. */
function digitando(){
  var a = document.activeElement;
  return !!a && (a.tagName === 'TEXTAREA' ||
                (a.tagName === 'INPUT' && a.type !== 'search' && a.type !== 'checkbox' &&
                 a.type !== 'radio'));
}

var pintaCedo = null;
function repintaLogo(){
  if(pintaCedo) return;
  /* junta rajadas de eventos numa pintura só */
  pintaCedo = setTimeout(function(){
    pintaCedo = null;
    if(digitando()) return;
    pinta();
  }, 350);
}

function chegou(tabela, tipo, linha){
  /* mensagem de WhatsApp na conversa aberta entra na hora, sem recarregar
     tudo — é o caso em que meio segundo de atraso se nota */
  if(tabela === 'mensagens_wpp' && tipo === 'INSERT'){
    if(linha.conversa_id === E.wpp.abertaId){
      var jaTem = E.wpp.msgs.some(function(m){
        return m.id === linha.id || (m.id_wpp && m.id_wpp === linha.id_wpp);
      });
      /* tira o eco da mensagem que já pintamos ao enviar */
      if(!jaTem && linha.de_mim){
        for(var i = E.wpp.msgs.length - 1; i >= 0; i--){
          var t = E.wpp.msgs[i];
          if(String(t.id).indexOf('temp') === 0 && t.texto === linha.texto){
            E.wpp.msgs.splice(i, 1); break;
          }
        }
      }
      if(!jaTem){
        E.wpp.msgs.push(linha);
        if(E.vista === 'whatsapp' && !digitando()){
          pinta();
          var cx = $('wppCorpo'); if(cx) cx.scrollTop = cx.scrollHeight;
        }
        avisaChegada(linha);
      }
    } else if(!linha.de_mim){
      avisaChegada(linha);
    }
  }

  if(tabela === 'wpp_sessao'){ E.wpp.sessao = linha; repintaLogo(); }

  /* o resto muda contador e lista: relê e repinta, agrupado */
  if(agrupa) clearTimeout(agrupa);
  agrupa = setTimeout(function(){
    carrega().then(function(){ if(!digitando()) pinta(); }).catch(function(){});
  }, 700);
}
var agrupa = null;

/* Um toque discreto quando chega mensagem e ele não está olhando. */
function avisaChegada(linha){
  if(linha.de_mim) return;
  if(E.vista === 'whatsapp' && !document.hidden) return;
  try{
    var a = new (window.AudioContext || window.webkitAudioContext)();
    var o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, a.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.22);
    o.start(); o.stop(a.currentTime + 0.24);
  }catch(e){}
  piscaTitulo();
}

var tituloOriginal = document.title, piscando = null;
function piscaTitulo(){
  if(piscando || !document.hidden) return;
  var liga = false;
  piscando = setInterval(function(){
    document.title = (liga = !liga) ? '💬 Mensagem nova' : tituloOriginal;
  }, 1200);
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && piscando){
    clearInterval(piscando); piscando = null; document.title = tituloOriginal;
  }
});

/* ---------- WhatsApp ---------- */
/* Na tela de pareamento a informação muda sozinha (o QR expira, o celular
   lê, a ponte conecta). Sem esta vigia o Gildemi escanearia e a tela
   ficaria parada no código velho. */
var vigia = null;
function vigiaSessaoWpp(){
  var precisa = E.vista === 'whatsapp' &&
                (!E.wpp.sessao || E.wpp.sessao.estado !== 'conectado');
  if(precisa && !vigia){
    /* Roda mesmo com o websocket de pé. O canal pode subir e não trazer
       nada (RLS mal configurado, por exemplo) — e aí a tela de QR ficaria
       parada pra sempre. Só enquanto não pareia, e para sozinha depois. */
    vigia = setInterval(function(){
      api('/rest/v1/wpp_sessao?select=*&id=eq.1').then(function(r){
        var nova = (r || [])[0] || null, antes = E.wpp.sessao;
        E.wpp.sessao = nova;
        var mudou = !antes || !nova ||
                    antes.estado !== nova.estado || antes.qr !== nova.qr;
        if(nova && nova.estado === 'conectado') return carrega().then(pinta);
        if(mudou) pinta();
      }).catch(function(){});
    }, 3000);
  } else if(!precisa && vigia){
    clearInterval(vigia); vigia = null;
  }
}
function abreConversaWpp(id){
  E.wpp.abertaId = id;
  E.wpp.msgs = [];
  pinta();
  api('/rest/v1/mensagens_wpp?conversa_id=eq.' + id + '&select=*&order=criado_at&limit=300')
    .then(function(r){
      if(E.wpp.abertaId !== id) return;
      E.wpp.msgs = r || [];
      pinta();
      var cx = $('wppCorpo'); if(cx) cx.scrollTop = cx.scrollHeight;
      /* abrir a conversa zera o contador — como em qualquer mensageiro */
      return api('/rest/v1/conversas_wpp?id=eq.' + id, {
        method:'PATCH', headers:{'Prefer':'return=minimal'},
        body: JSON.stringify({nao_lidas:0})
      }).then(carrega).then(function(){
        E.wpp.msgs = r || [];   /* carrega() nao mexe nas mensagens abertas */
        pinta();
        var c2 = $('wppCorpo'); if(c2) c2.scrollTop = c2.scrollHeight;
      });
    })
    .catch(function(e){ var el = $('erroWpp'); if(el) el.textContent = e.message; });
}

function enviaWpp(){
  var cx = $('wppTexto'), texto = cx.value.trim();
  if(!texto) return;
  var aberta = null;
  E.wpp.caixa.forEach(function(c){ if(c.conversa_id === E.wpp.abertaId) aberta = c; });
  if(!aberta) return;

  cx.value = ''; cx.style.height = 'auto';
  /* mostra na hora; a ponte entrega em segundos e a linha real chega depois */
  E.wpp.msgs.push({id:'temp'+Date.now(), de_mim:true, texto:texto,
                   criado_at:new Date().toISOString(), entregue:false});
  pinta();
  var c3 = $('wppCorpo'); if(c3) c3.scrollTop = c3.scrollHeight;

  api('/rest/v1/wpp_fila', {
    method:'POST', headers:{'Prefer':'return=minimal'},
    body: JSON.stringify({telefone:aberta.telefone, texto:texto})
  })
  .catch(function(e){
    var el = $('erroWpp'); if(el) el.textContent = 'Não entrou na fila: ' + e.message;
  });
}

function salvaContato(){
  var aberta = null;
  E.wpp.caixa.forEach(function(c){ if(c.conversa_id === E.wpp.abertaId) aberta = c; });
  if(!aberta) return;
  var bt = $('btSalvaContato');
  bt.disabled = true;
  $('erroContato').textContent = '';

  var etiq = $('ctEtiq').value.split(',').map(function(x){ return x.trim(); })
    .filter(Boolean);

  api('/rest/v1/contatos?id=eq.' + aberta.contato_id, {
    method:'PATCH', headers:{'Prefer':'return=minimal'},
    body: JSON.stringify({
      nome:   $('ctNome').value.trim() || null,
      cidade: $('ctCidade').value.trim() || null,
      etiquetas: etiq.length ? etiq : null,
      caso_id: $('ctCaso').value || null,
      notas:  $('ctNotas').value.trim() || null
    })
  })
  .then(carrega)
  .then(function(){
    pinta();
    var sv = $('salvoWpp');
    if(sv){ sv.classList.add('ver');
      setTimeout(function(){ var x = $('salvoWpp'); if(x) x.classList.remove('ver'); }, 1800); }
  })
  .catch(function(e){
    var el = $('erroContato'); if(el) el.textContent = e.message;
    var b = $('btSalvaContato'); if(b) b.disabled = false;
  });
}
