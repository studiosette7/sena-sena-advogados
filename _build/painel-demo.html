      '<b>Quem tiver esse endereço enxerga a agenda.</b> Trate como senha.</div></div>';

  abreModal('Agenda no celular', explica +
    '<div class="vazio"><span class="girando" style="border-color:rgba(22,41,74,.2);' +
    'border-top-color:var(--marinho)"></span><div style="margin-top:10px">Gerando o endereço…</div></div>', '');

  /* o endereço carrega um segredo, então quem entrega é o servidor —
     o navegador nunca monta isso sozinho */
  api('/functions/v1/agenda?link=1')
    .then(function(r){
      abreModal('Agenda no celular', explica +
        '<div class="campo" style="margin:0"><label for="urlIcs">Endereço do calendário</label>' +
          '<input id="urlIcs" readonly value="' + esc(r.url) + '"></div>' + instrucoes,
        '<button class="bt bt-fino" data-fecha="">Fechar</button>' +
        '<button class="bt bt-ouro" id="btCopiaIcs">Copiar endereço</button>');
    })
    .catch(function(e){
      abreModal('Agenda no celular', explica +
        '<p class="erro">Não deu pra gerar: ' + esc(e.message) + '</p>' +
        '<p style="font-size:13px;color:var(--cinza)">Confira se a função <b>agenda</b> foi publicada ' +
        'e se o segredo <b>AGENDA_TOKEN</b> está configurado.</p>', '');
    });
}

/* ===================================================================
   Eventos
   =================================================================== */
document.addEventListener('click', function(e){
  var al = e.target.closest('[data-ir]');
  if(al){
    if(al.dataset.ir === 'criticos'){ E.filtro = 'criticos'; E.modo = 'lista'; vai('esteira'); }
    else { E.filtro = null; vai(al.dataset.ir); }
    return;
  }

  var nav = e.target.closest('.nav a');
  if(nav){ e.preventDefault(); E.filtro = null; fechaLado(); vai(nav.dataset.v); return; }

  var caso = e.target.closest('[data-caso]');
  if(caso && caso.dataset.caso){
    if(caso.dataset.arrastou) return;      /* veio de um arrasto, não de um clique */
    fechaModal(); vai('caso', caso.dataset.caso); return;
  }

  var ir2 = e.target.closest('[data-ir2]');
  if(ir2 && ir2.dataset.ir2){ fechaModal(); vai(ir2.dataset.ir2); return; }

  var rap = e.target.closest('[data-rapida]');
  if(rap){
    var a = rap.dataset.rapida;
    if(a === 'novo')   modalNovoCaso();
    if(a === 'ler'){ E.assist = 'ler'; vai('assistente'); }
    if(a === 'varrer') varrerDiario(null);
    if(a === 'criticos'){ E.filtro = 'criticos'; E.modo = 'lista'; vai('esteira'); }
    if(a === 'triar'){
      var fila = E.casos.filter(function(c){ return c.etapa === 'triagem'; });
      if(fila.length) vai('caso', fila[fila.length-1].id);
      else alert('Nenhum caso esperando triagem.');
    }
    return;
  }

  var fil = e.target.closest('[data-filtro]');
  if(fil){ E.filtro = fil.dataset.filtro || null; pinta(); return; }

  var ab = e.target.closest('[data-assist]');
  if(ab){ E.assist = ab.dataset.assist; pinta(); return; }

  var at = e.target.closest('[data-atalho]');
  if(at){
    $('pergunta').value = at.dataset.atalho;
    ajustaAltura($('pergunta'));
    pergunta();
    return;
  }

  var cw = e.target.closest('[data-conversa-wpp]');
  if(cw){ abreConversaWpp(cw.dataset.conversaWpp); return; }

  var cv = e.target.closest('[data-conversa]');
  if(cv){ E.assist = 'perguntar'; abreConversa(cv.dataset.conversa); return; }

  var pp = e.target.closest('[data-passo]');
  if(pp){ proximoPasso(pp.dataset.passo, pp); return; }

  var vt = e.target.closest('[data-vira-tarefa]');
  if(vt){ agendaDaAnalise(parseInt(vt.dataset.viraTarefa, 10), vt.dataset.doc); return; }

  var vd = e.target.closest('[data-documento]');
  if(vd){
    var d = null;
    E.docs.forEach(function(x){ if(x.id === vd.dataset.documento) d = x; });
    if(d && d.analise){ E.assist = 'ler'; pinta(); E.docAtual = d.id; pintaAnaliseDoc(d.analise, d.id); }
    else if(d) alert('Esse documento ainda não foi lido.');
    return;
  }

  var mo = e.target.closest('[data-modo]');
  if(mo){ E.modo = mo.dataset.modo; pinta(); return; }

  var ar = e.target.closest('[data-area]');
  if(ar){ E.area = ar.dataset.area; pinta(); return; }

  var dia = e.target.closest('[data-dia]');
  if(dia){ E.diaSel = dia.dataset.dia; pinta(); return; }

  var proc = e.target.closest('[data-processo]');
  if(proc){ E.processoAberto = proc.dataset.processo; pinta(); return; }
  if(e.target.closest('[data-voltar-processos]')){ E.processoAberto = null; pinta(); return; }

  var mes = e.target.closest('[data-mes]');
  if(mes){
    var p = parseInt(mes.dataset.mes, 10);
    E.mesRef = p === 0 ? new Date() : new Date(E.mesRef.getFullYear(), E.mesRef.getMonth() + p, 1);
    pinta(); return;
  }

  var fe = e.target.closest('[data-feita]');
  if(fe){ marcaFeita(fe.dataset.feita); return; }

  var nt = e.target.closest('[data-nova-tarefa]');
  if(nt){ modalNovaTarefa(nt.dataset.novaTarefa || null); return; }

  var txt = e.target.closest('[data-abrir-txt]');
  if(txt){
    var alvo = txt.closest('.linha-item').querySelector('[data-pub-txt]');
    alvo.classList.toggle('aberta');
    txt.textContent = alvo.classList.contains('aberta') ? 'Recolher' : 'Ler tudo';
    return;
  }
  var lida = e.target.closest('[data-lida]');
  if(lida){
    api('/rest/v1/publicacoes?id_cnj=eq.' + lida.dataset.lida, {
      method:'PATCH', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({lida:true})
    }).then(carrega).then(pinta).catch(function(x){ alert(x.message); });
    return;
  }
  var and = e.target.closest('[data-andamento]');
  if(and){ verAndamento(and.dataset.andamento, and.dataset.trib); return; }

  if(e.target.closest('[data-fecha]')) { fechaModal(); return; }
  if(e.target.id === 'fundoModal')     { fechaModal(); return; }

  var id = e.target.closest('button') ? e.target.closest('button').id : '';
  if(id === 'btSalva')      salvar();
  else if(id === 'btMov')   registraMov();
  else if(id === 'btIA')    analisa();
  else if(id === 'btApaga') apaga();
  else if(id === 'btNovo')  modalNovoCaso();
  else if(id === 'btSino')  modalAlertas();
  else if(id === 'btVarrer') varrerDiario(e.target.closest('button'));
  else if(id === 'btCriaCaso')   criaCaso();
  else if(id === 'btCriaTarefa') criaTarefa();
  else if(id === 'btAssinar')    modalAssinar();
  else if(id === 'btPerguntarCaso'){
    var cc = acha(E.casoId);
    E.conversaCtx = {caso:E.casoId, nome:cc ? cc.nome : '', tipo:'caso'};
    E.conversaId = null; E.msgs = [];
    E.assist = 'perguntar'; vai('assistente');
  }
  else if(id === 'btMinutarCaso'){   E.casoCtx = E.casoId; E.assist = 'minutar';   vai('assistente'); }
  else if(id === 'btPerguntar')    pergunta();
  else if(id === 'btVoz')          alternaVoz();
  else if(id === 'btEnviaWpp')     enviaWpp();
  else if(id === 'btSalvaContato') salvaContato();
  else if(id === 'btViraCaso')     viraCaso();
  else if(id === 'btCriaDoContato')criaDoContato();
  else if(id === 'btNovaConversa') novaConversa();
  else if(id === 'btLer')       mandaArquivo();
  else if(id === 'btMinutar')   minuta();
  else if(id === 'btCopiaMinuta'){
    var mt = $('minutaTexto').textContent, bm = e.target.closest('button');
    if(navigator.clipboard) navigator.clipboard.writeText(mt);
    bm.textContent = 'Copiado';
    setTimeout(function(){ if(bm) bm.textContent = 'Copiar'; }, 1500);
  }
  else if(id === 'btPreviaDia')    modalPrevia('diario');
  else if(id === 'btPreviaSemana') modalPrevia('semanal');
  else if(id === 'btMenu'){ $('lateral').classList.add('aberta');
    var capa = document.createElement('div'); capa.className = 'capa-lado'; capa.id = 'capaLado';
    capa.addEventListener('click', fechaLado); document.body.appendChild(capa); }
  else if(id === 'btCopia' || id === 'btCopiaIcs'){
    var t = id === 'btCopia' ? $('rascunho').textContent : $('urlIcs').value, b = e.target.closest('button');
    if(navigator.clipboard) navigator.clipboard.writeText(t);
    b.textContent = 'Copiado'; setTimeout(function(){ if(b) b.textContent = 'Copiar' + (id === 'btCopiaIcs' ? ' endereço' : ''); }, 1500);
  }
});

function fechaLado(){
  $('lateral').classList.remove('aberta');
  var c = $('capaLado'); if(c) c.remove();
}

/* o input de arquivo é recriado a cada pintura, então o ouvinte fica no
   documento em vez de no elemento */
document.addEventListener('input', function(e){
  if(e.target.id === 'pergunta' || e.target.id === 'wppTexto') ajustaAltura(e.target);
  if(e.target.id === 'wppBusca'){
    E.wpp.busca = e.target.value;
    var foco = document.activeElement === e.target, pos = e.target.selectionStart;
    pinta();
    if(foco){ var novo = $('wppBusca'); if(novo){ novo.focus(); novo.setSelectionRange(pos,pos); } }
  }
});
document.addEventListener('keydown', function(e){
  if(e.target.id === 'pergunta' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault(); pergunta();
  }
  if(e.target.id === 'wppTexto' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault(); enviaWpp();
  }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'arquivo'){
    var f = e.target.files[0], bt = $('btLer'), cx = $('solta');
    if(bt) bt.disabled = !f;
    if(cx && f) cx.querySelector('b').textContent = f.name;
  }
});


$('busca').addEventListener('input', function(){
  E.busca = this.value;
  /* buscar no meio de um caso ou do painel joga pra lista, que é onde
     a busca faz sentido. Dentro de processos, busca processo. */
  if(E.vista === 'caso' || E.vista === 'painel' || E.vista === 'agenda'){
    E.modo = 'lista'; vai('esteira');
  } else pinta();
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ fechaModal(); fechaLado(); }
  if((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)){ e.preventDefault(); $('busca').focus(); }
});

$('formEntrada').addEventListener('submit', function(e){
  e.preventDefault();
  var bt = $('btEntrar');
  bt.disabled = true; bt.textContent = 'Entrando…';
  $('erroEntrada').textContent = '';
  entrar($('email').value.trim(), $('senha').value)
    .then(abre)
    .catch(function(err){
      $('erroEntrada').textContent = /Invalid login/i.test(err.message)
        ? 'E-mail ou senha não conferem.' : err.message;
    })
    .then(function(){ bt.disabled = false; bt.textContent = 'Entrar'; });
});

function sair(){
  desligaTempoReal();
  limpaSessao();
  $('app').classList.add('oculto');
  $('telaEntrada').classList.remove('oculto');
  fechaModal();
}
$('btSair').addEventListener('click', function(){
  if(sessao) fetch(URL_SB + '/auth/v1/logout', {
    method:'POST', headers:{'apikey':ANON,'Authorization':'Bearer ' + sessao.access_token}
  }).catch(function(){});
  sair();
});

function abre(){
  $('telaEntrada').classList.add('oculto');
  $('app').classList.remove('oculto');
  var email = (sessao && sessao.user && sessao.user.email) || '';
  $('euN').textContent = ADV;
  $('euAv').textContent = iniciais(ADV || email);
  daHash();
  tempoReal();
  carrega().then(pinta).catch(function(e){
    $('conteudo').innerHTML = '<div class="bloco"><div class="vazio">Não deu pra carregar: ' +
      esc(e.message) + '</div></div>';
  });
}

/* ---------- partida ---------- */
if(!URL_SB || !ANON){
  $('erroEntrada').textContent = 'Falta configurar o Supabase no build.py (SUPABASE_URL e SUPABASE_ANON).';
  $('btEntrar').disabled = true;
} else if(sessao && sessao.refresh_token){
  renova().then(abre, function(){ limpaSessao(); });
}

/* recarrega ao voltar pra aba — o dia do advogado acontece fora daqui */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && sessao && !$('app').classList.contains('oculto'))
    carrega().then(pinta).catch(function(){});
});
})();
</script>
