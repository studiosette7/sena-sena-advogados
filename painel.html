          '<p class="uso">Revise antes de enviar: sai em nome do escritório, e a OAB não ' +
          'permite promessa de resultado nem menção a valores.</p>'
        : '');
  return '<div class="msg msg-ia">' +
    '<span class="msg-av">' + ico('faisca') + '</span>' +

function pintaFontes(fontes){
  if(!fontes || !fontes.length) return '';
  return '<h4>Fontes consultadas</h4><ul class="fontes">' + fontes.map(function(f){
    return '<li><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.titulo) + '</a></li>';
  }).join('') + '</ul>';
}

/* markdown mínimo: é o que a IA usa e o que dá pra ler */
function textoRico(t){
  var linhas = String(t || '').split('\n'), saida = '', naLista = false;
  linhas.forEach(function(l){
    var neg = esc(l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if(/^#{1,4}\s/.test(l)){
      if(naLista){ saida += '</ul>'; naLista = false; }
      saida += '<h4>' + neg.replace(/^#{1,4}\s*/, '') + '</h4>';
    } else if(/^\s*[-•*]\s/.test(l)){
      if(!naLista){ saida += '<ul class="itens">'; naLista = true; }
      saida += '<li>' + neg.replace(/^\s*[-•*]\s*/, '') + '</li>';
    } else {
      if(naLista){ saida += '</ul>'; naLista = false; }
      if(l.trim()) saida += '<p>' + neg + '</p>';
    }
  });
  if(naLista) saida += '</ul>';
  return saida;
}

/* Devolve o HTML da análise (a bolha do chat pinta isso). Antes escrevia
   direto num #saidaAssist da aba que não existe mais. */
function htmlAnalise(a, docId){
  function bloco(titulo, arr){
    if(!arr || !arr.length) return '';
    return '<h4>' + titulo + '</h4><ul class="itens">' +
      arr.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
  }
  var datas = (a.datas || []).map(function(d, i){
    var tt = TIPO_TAREFA[d.tipo] || TIPO_TAREFA.tarefa;
    return '<div class="tarefa-l" style="align-items:center">' +
      '<span class="icone-cx" style="background:' + tt[3] + ';color:' + tt[2] + '">' + ico('agenda') + '</span>' +
      '<div style="flex:1;min-width:0"><div class="tarefa-t">' + esc(d.titulo) + '</div>' +
      '<div class="tarefa-q">' + data(d.data) + ' · ' + esc(d.por_que) + '</div></div>' +
      '<button class="bt bt-fino bt-mini" data-vira-tarefa="' + i + '" data-doc="' + esc(docId || '') + '">' +
        ico('mais') + 'Agendar</button></div>';
  }).join('');

  E.ultimaAnalise = a;
  E.docAtual = docId || E.docAtual;

  /* O documento lido não é o fim: daqui ele resume, pergunta em cima ou
     já manda escrever a peça que responde o que está no PDF. */
  var proximo = '<div class="proximo">' +
    '<div class="proximo-t">' + ico('dir') + 'Próximo passo</div>' +
    '<div class="proximo-b">' +
      '<button class="passo" data-passo="resumo-escritorio">' +
        '<span class="icone-cx" style="background:var(--azul-cl);color:var(--azul)">' + ico('lista') + '</span>' +
        '<b>Resumir pra mim</b><span>Nota curta pro processo</span></button>' +
      '<button class="passo" data-passo="resumo-cliente">' +
        '<span class="icone-cx" style="background:var(--verde-cl);color:var(--verde)">' + ico('zap') + '</span>' +
        '<b>Resumir pro cliente</b><span>Sem juridiquês, pronto pro WhatsApp</span></button>' +
      '<button class="passo" data-passo="peca">' +
        '<span class="icone-cx" style="background:var(--ambar-cl);color:var(--ambar)">' + ico('pasta') + '</span>' +
        '<b>Escrever a peça</b><span>Já respondendo o que está aqui</span></button>' +
    '</div>' +
  '</div>';

  return '<div class="resposta">' +
    (a.alerta ? '<div class="aviso" style="margin-bottom:14px">' + ico('alerta') +
      '<div><b>' + esc(a.alerta) + '</b></div></div>' : '') +
    '<span class="tag tag-roxo">' + esc(a.tipo_documento) + '</span>' +
    '<p style="margin:11px 0 4px">' + esc(a.resumo) + '</p>' +
    ((a.partes || []).length ? '<h4>Partes</h4><dl class="linhas">' + a.partes.map(function(p){
      return '<dt>' + esc(p.papel) + '</dt><dd>' + esc(p.nome) + '</dd>';
    }).join('') + '</dl>' : '') +
    bloco('Fatos', a.fatos) +
    (datas ? '<h4>Datas encontradas</h4>' + datas : '') +
    bloco('A favor', a.pontos_favoraveis) +
    bloco('Contra', a.pontos_contra) +
    bloco('Próximos passos', a.proximos_passos) +
    bloco('Falta juntar', a.documentos_faltando) +
    proximo +

function fone(t){
  var d = String(t || '').replace(/\D/g,'');
  if(d.length === 13) return '+' + d.slice(0,2) + ' (' + d.slice(2,4) + ') ' + d.slice(4,9) + '-' + d.slice(9);
  if(d.length === 12) return '+' + d.slice(0,2) + ' (' + d.slice(2,4) + ') ' + d.slice(4,8) + '-' + d.slice(8);
  return t;
}

/* Filtra por pasta usando os labelIds que o Gmail manda. Mensagem
   sincronizada antes dessa coluna existir vem com labels vazio — nesse
   caso trata como "recebida" (a não ser que já saibamos que foi enviada
   por nós), pra não sumir da caixa de entrada. */
function bateNaPasta(m, pasta){
  var labels = m.labels || [];
  if(pasta === 'tudo') return true;
  if(pasta === 'enviados') return !!m.enviada_por_mim || labels.indexOf('SENT') > -1;
  // inbox
  if(m.enviada_por_mim) return false;
  if(!labels.length) return true;
  return labels.indexOf('INBOX') > -1;
}

function prazoKpi(c){
  if(!c.data_saida){
    return '<div class="kpi"><span class="kpi-t">' + ico('relogio') + 'Prescrição</span>' +
      '<span class="kpi-n" style="font-size:19px;padding-top:6px">sem data</span>' +
      '<span class="kpi-s">' + (c.saida ? 'disse: ' + esc(c.saida) : 'preencha o fim do contrato') + '</span></div>';
  }
  var restam = c.dias_restantes,
      pct = Math.max(0, Math.min(100, restam / 730 * 100));
  return '<div class="kpi" data-a="' + esc(c.alerta_prazo) + '">' +
    '<span class="kpi-t">' + ico('relogio') + 'Prescrição bienal</span>' +
    '<span class="prazo-n num">' + (restam < 0 ? 'vencido' : restam + (restam === 1 ? ' dia' : ' dias')) + '</span>' +
    '<span class="prazo-b"><i style="width:' + pct.toFixed(1) + '%"></i></span>' +
    '<span class="kpi-s">' + (restam < 0 ? 'prescreveu em ' : 'prescreve em ') + data(c.prescreve_em) + '</span></div>';
}

function ficha(c){
  var l = [
    ['Situação', c.situacao], ['Tempo desde a saída', c.saida],
    ['O que ficou pra trás', (c.pontos||[]).join(', ')],
    ['Benefício', (c.beneficio||[]).join(', ')], ['No INSS', c.inss],
    ['Documentos que tem', c.documentos], ['Relato', c.relato]
  ].filter(function(p){ return p[1]; });
  if(!l.length) return '<div class="vazio" style="padding:16px">Ficha sem detalhes.</div>';
  return '<dl class="linhas">' + l.map(function(p){
    return '<dt>' + p[0] + '</dt><dd>' + esc(p[1]) + '</dd>';
  }).join('') + '</dl>';
}

function salvar(){
  var id = E.casoId, bt = $('btSalva');
  bt.disabled = true; $('erroSalvar').textContent = '';
  api('/rest/v1/casos?id=eq.' + id, {
    method:'PATCH', headers:{'Prefer':'return=minimal'},
    body: JSON.stringify({
      etapa: $('cpEtapa').value,
      data_saida: $('cpData').value || null,
      notas: $('cpNotas').value.trim() || null
    })
  })
  .then(carrega)
  .then(function(){
    pinta();
    var s = $('salvo');
    if(s){ s.classList.add('ver'); setTimeout(function(){ var x = $('salvo'); if(x) x.classList.remove('ver'); }, 1800); }
  })
  .catch(function(e){ var el = $('erroSalvar'); if(el) el.textContent = e.message; if(bt) bt.disabled = false; });
}

function registraMov(){
  var texto = $('cpMov').value.trim();
  if(!texto) return;
  var bt = $('btMov'); bt.disabled = true;
  api('/rest/v1/movimentacoes', {
    method:'POST', headers:{'Prefer':'return=minimal'},
    body: JSON.stringify({caso_id:E.casoId, texto:texto, tipo:'nota'})
  })
  .then(carrega).then(pinta)
  .catch(function(e){ alert('Não deu pra registrar: ' + e.message); if(bt) bt.disabled = false; });
}

function analisa(){
  var id = E.casoId, bt = $('btIA');
  bt.disabled = true; bt.innerHTML = '<span class="girando"></span> Analisando…';
  var el = $('erroIA'); if(el) el.textContent = '';
  api('/functions/v1/triagem', {method:'POST', body: JSON.stringify({caso_id:id})})
    .then(carrega).then(pinta)
    .catch(function(e){
      var b = $('btIA'); if(b){ b.disabled = false; b.textContent = 'Tentar de novo'; }
      var x = $('erroIA'); if(x) x.textContent = e.message;
    });
}

function apaga(){
  var c = acha(E.casoId);
  if(!c || !confirm('Apagar o caso de ' + c.nome + '? Isso não volta.')) return;
  api('/rest/v1/casos?id=eq.' + E.casoId, {method:'DELETE', headers:{'Prefer':'return=minimal'}})
    .then(carrega).then(function(){ vai('esteira'); })
    .catch(function(e){ alert('Não deu pra apagar: ' + e.message); });
}

function marcaFeita(id){
  var t = null;
  E.tarefas.forEach(function(x){ if(x.id === id) t = x; });
  if(!t) return;
  var novo = !t.feita;
  t.feita = novo; pinta();
  api('/rest/v1/tarefas?id=eq.' + id, {
    method:'PATCH', headers:{'Prefer':'return=minimal'},
    body: JSON.stringify({feita:novo, feita_at: novo ? new Date().toISOString() : null})
  }).then(carrega).then(pinta)
    .catch(function(e){ t.feita = !novo; pinta(); alert('Não deu pra marcar: ' + e.message); });
}

function varrerDiario(bt){
  if(bt){ bt.disabled = true; bt.innerHTML = '<span class="girando"></span> Buscando…'; }
  api('/functions/v1/cnj', {method:'POST', body: JSON.stringify({acao:'varrer'})})
    .then(function(r){
      return carrega().then(function(){
        pinta();
        alert(r.novas ? r.novas + ' publicação(ões) nova(s) encontrada(s).'
                      : 'Nenhuma publicação nova. Tudo em dia.');
      });
    })
    .catch(function(e){ alert('Não deu pra buscar no Diário: ' + e.message); pinta(); });
}

function verAndamento(processo, tribunal, processoId){
  abreModal('Andamento do processo',
    '<div class="vazio"><span class="girando" style="border-color:rgba(22,41,74,.2);border-top-color:var(--marinho)"></span>' +
    '<div style="margin-top:10px">Consultando o DataJud do CNJ…</div></div>', '');
  api('/functions/v1/cnj', {
    method:'POST', body: JSON.stringify({acao:'andamento', processo:processo, tribunal:tribunal, processo_id:processoId || null})
  })
  .then(function(r){
    if(!r.encontrado) return abreModal('Andamento do processo',
      '<div class="vazio">O DataJud não tem esse processo indexado.</div>', '');
    abreModal('Andamento do processo',
      '<dl class="linhas" style="margin-bottom:16px">' +
        '<dt>Classe</dt><dd>' + esc(r.classe || '—') + '</dd>' +
        '<dt>Órgão</dt><dd>' + esc(r.orgao || '—') + '</dd>' +
        '<dt>Movimentos</dt><dd>' + r.movimentos.length + '</dd></dl>' +
      '<div class="trilha">' + r.movimentos.slice(0,40).map(function(m){
        var q = String(m.quando || '');
        return '<div class="trilha-i"><div class="trilha-q">' +
          (q.length >= 8 ? q.slice(6,8) + '/' + q.slice(4,6) + '/' + q.slice(0,4) : '—') +
          '</div><div class="trilha-t">' + esc(m.nome) + '</div></div>';
      }).join('') + '</div>', '');
    /* o backend já gravou em processo_movimentos — recarrega pra timeline
       e a aba "Movimentações" do processo mostrarem sem precisar buscar de novo */
    if(processoId) carregaMovimentosProcesso(processoId).then(function(){ if(E.processoAberto === processoId) pinta(); });
  })
  .catch(function(e){ abreModal('Andamento do processo', '<p class="erro">' + esc(e.message) + '</p>', ''); });
}

/* Preenchimento manual dos campos que nem sempre vêm de graça (valor da

/* ---------- ações de triagem de processo ---------- */

    .then(function(r){ E.procMovimentos = {processoId:id, itens:r || []}; })

/* ---------- ações da assistente ---------- */
function ocupado(bt, texto){
  if(!bt) return;
  bt.disabled = true;
  /* guarda o rótulo só na primeira vez: o envio troca de "Enviando" pra
     "Lendo", e sobrescrever aqui deixaria o botão preso no spinner */
  if(!bt.dataset.antes) bt.dataset.antes = bt.innerHTML;
  bt.innerHTML = '<span class="girando"></span> ' + texto;
}
function livre(bt){
  if(!bt) return;
  bt.disabled = false;
  if(bt.dataset.antes){ bt.innerHTML = bt.dataset.antes; delete bt.dataset.antes; }
}
function erroAssist(msg){
  var el = $('erroAssist'); if(el) el.textContent = msg;
}

/* ---------------------------------------------------------------
   O chat.

   A resposta vem em pedaços (SSE) e é escrita na tela enquanto sai —
   uma pergunta com busca leva de 20 a 60 segundos, e tela parada esse
   tempo todo parece travamento.
--------------------------------------------------------------- */
function rolaFim(){
  var cx = $('chatCorpo');
  if(cx) cx.scrollTop = cx.scrollHeight;
}

function abreConversa(id){
  E.conversaId = id;
  E.msgs = [];
  pinta();
  if(!id) return;
  api('/rest/v1/mensagens?conversa_id=eq.' + id + '&select=*&order=criado_at')
    .then(function(r){
      if(E.conversaId !== id) return;
      E.msgs = (r || []).map(function(m){
        return {papel:m.papel, texto:m.texto, fontes:m.fontes};
      });
      pinta(); rolaFim();
    })
    .catch(function(e){ erroAssist(e.message); });
}

function novaConversa(){
  E.conversaId = null; E.msgs = []; E.conversaCtx = {};
  pinta();
}

/** Cria a conversa no banco na primeira mensagem, não antes. */
function garanteConversa(){
  if(E.conversaId) return Promise.resolve(E.conversaId);
  return api('/rest/v1/conversas', {
    method:'POST', headers:{'Prefer':'return=representation'},
    body: JSON.stringify({
      caso_id: E.conversaCtx.caso || null,
      documento_id: E.conversaCtx.documento || null,
      processo_id: E.conversaCtx.processo || null
    })
  }).then(function(r){ E.conversaId = r[0].id; return E.conversaId; });
}

function pergunta(){
  var cx = $('pergunta'), texto = cx.value.trim();
  if(E.respondendo) return;
  /* um campo só: com PDF anexado a IA lê o documento, sem PDF é conversa
     (inclusive pedido de peça — a regra da minuta está no prompt dela) */
  if((E.assistArquivos || []).length){
    cx.value = ''; cx.style.height = 'auto';
    mandaArquivo(texto);
    return;
  }
  if(!texto) return;
  erroAssist('');
  cx.value = ''; cx.style.height = 'auto';

  E.msgs.push({papel:'user', texto:texto});
  E.msgs.push({papel:'assistant', texto:'', pensando:true});
  E.respondendo = true;
  pinta(); rolaFim();

  garanteConversa()
    .then(function(id){ return conversa(id, texto); })
    .catch(function(e){
      E.msgs.pop();
      E.respondendo = false;
      pinta(); erroAssist(e.message);
    });
}

function conversa(id, texto){
  var atual = E.msgs[E.msgs.length - 1];

  return fetch(URL_SB + '/functions/v1/advogado', {
    method:'POST',
    headers:{
      'apikey': ANON,
      'Authorization': 'Bearer ' + (sessao ? sessao.access_token : ''),
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({acao:'conversar', conversa_id:id, mensagem:texto})
  })
  .then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(t || ('erro ' + r.status)); });
    if(!r.body) throw new Error('sem resposta do servidor');

    var leitor = r.body.getReader(), dec = new TextDecoder(), sobra = '';

    function passo(){
      return leitor.read().then(function(bloco){
        if(bloco.done) return;
        sobra += dec.decode(bloco.value, {stream:true});

        /* SSE separa eventos por linha em branco */
        var partes = sobra.split('\n\n');
        sobra = partes.pop();

        partes.forEach(function(p){
          var evento = (/^event:\s*(.+)$/m.exec(p) || [])[1],
              dados  = (/^data:\s*(.+)$/m.exec(p) || [])[1];
          if(!evento || !dados) return;
          var d;
          try{ d = JSON.parse(dados); }catch(e){ return; }

          if(evento === 'texto'){
            atual.pensando = false;
            atual.texto += d.t;
            pintaBolhaViva(atual);
          } else if(evento === 'buscando'){
            atual.buscando = d.q || '';
            pintaBolhaViva(atual);
          } else if(evento === 'fim'){
            atual.fontes = d.fontes; atual.uso = d.uso;
            atual.buscando = null; atual.pensando = false;
          } else if(evento === 'erro'){
            throw new Error(d.erro);
          }
        });
        return passo();
      });
    }

    return passo();
  })
  .then(function(){
    E.respondendo = false;
    pinta(); rolaFim();
    return carrega().then(function(){ /* atualiza a lista de conversas */ });
  })
  .catch(function(e){
    E.respondendo = false;
    if(atual && !atual.texto) E.msgs.pop();
    pinta(); erroAssist(e.message);
  });
}

/* Escreve só a última bolha enquanto o texto chega. Repintar a tela
   inteira a cada pedaço perderia o foco e a rolagem. */
function pintaBolhaViva(m){
  var cx = $('chatCorpo');
  if(!cx) return;
  var alvo = cx.querySelector('.msg-ia:last-child .balao');
  if(!alvo) return;
  var perto = cx.scrollHeight - cx.scrollTop - cx.clientHeight < 90;
  alvo.innerHTML = (m.buscando
      ? '<div class="buscando">' + ico('busca') + 'Consultando: ' + esc(m.buscando) + '</div>'
      : '') +
    (m.texto ? textoRico(m.texto) + '<span class="cursor"></span>'
             : '<span class="pontinhos"><i></i><i></i><i></i></span>');
  if(perto) cx.scrollTop = cx.scrollHeight;
}

/* ---------- ditado ---------- */
/* Usa o reconhecimento do próprio navegador: não custa nada, não sobe
   áudio pra lugar nenhum e transcreve em português na hora.
   Chrome e Safari têm; Firefox não. */
var Ouvinte = window.SpeechRecognition || window.webkitSpeechRecognition,
    ouvindo = null;

function alternaVoz(){
  var bt = $('btVoz'), cx = $('pergunta'), dica = $('chatDica');
  if(!Ouvinte){
    erroAssist('Este navegador não tem ditado. Use o Chrome ou o Safari.');
    return;
  }
  if(ouvindo){ ouvindo.stop(); return; }

  var r = new Ouvinte();
  r.lang = 'pt-BR';
  r.continuous = true;
  r.interimResults = true;

  var jaFirmado = cx.value ? cx.value + ' ' : '';

  r.onstart = function(){
    ouvindo = r;
    bt.classList.add('ouvindo');
    bt.innerHTML = ico('parar');
    if(dica) dica.textContent = 'Pode falar. Aperte de novo pra parar.';
  };
  r.onresult = function(e){
    var firme = '', voando = '';
    for(var i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) firme += e.results[i][0].transcript;
      else voando += e.results[i][0].transcript;
    }
    if(firme) jaFirmado += firme + ' ';
    cx.value = jaFirmado + voando;
    ajustaAltura(cx);
  };
  r.onerror = function(e){
    erroAssist(e.error === 'not-allowed'
      ? 'Precisa liberar o microfone pro site.'
      : 'Não deu pra ouvir: ' + e.error);
  };
  r.onend = function(){
    ouvindo = null;
    var b = $('btVoz');
    if(b){ b.classList.remove('ouvindo'); b.innerHTML = ico('microfone'); }
    var d = $('chatDica');
    if(d) d.textContent = 'Enter envia · Shift+Enter quebra linha';
  };

  try{ r.start(); }catch(e){ erroAssist('Não deu pra iniciar o ditado.'); }
}

function ajustaAltura(cx){
  cx.style.height = 'auto';
  cx.style.height = Math.min(cx.scrollHeight, 170) + 'px';
}

/* PDF anexado na conversa: sobe pro cofre, vira linha em `documentos` e
   a análise volta como bolha da IA — é o que a aba "Ler documento" fazia
   num formulário separado. */
function mandaArquivo(texto){
  var fila = (E.assistArquivos || []).slice();
  if(!fila.length) return;
  var grande = fila.filter(function(f){ return f.size > 28 * 1024 * 1024; });
  if(grande.length){ erroAssist("Arquivo grande demais (máximo 28 MB): " + grande[0].name); return; }
  erroAssist("");

  E.assistArquivos = [];
  E.msgs.push({papel:"user", texto:texto || (fila.length > 1 ? "Leia estes documentos." : "Leia este documento."),
               anexo:fila.map(function(f){ return f.name; }).join(", ")});
  E.respondendo = true;
  pinta(); rolaFim();

  /* um de cada vez: cada PDF é uma leitura pesada da IA, e a análise de
     cada um entra como uma bolha própria na conversa */
  var passo = fila.reduce(function(antes, f){
    return antes.then(function(){ return leUmDocumento(f); });
  }, Promise.resolve());

  passo
    .catch(function(e){ erroAssist(e.message); })
    .then(function(){ E.respondendo = false; return carrega(); })
    .then(function(){ pinta(); rolaFim(); });
}

function leUmDocumento(f){
  E.msgs.push({papel:"assistant", texto:"", pensando:true});
  pinta(); rolaFim();

  var caminho = Date.now() + "-" + f.name.replace(/[^w.-]+/g, "_");

  /* o arquivo vai pro cofre privado do Supabase; a IA lê de lá pelo
     servidor, então o PDF nunca passa pela chave da IA no navegador */
  return fetch(URL_SB + "/storage/v1/object/documentos/" + encodeURIComponent(caminho), {
    method:"POST",
    headers:{
      "apikey": ANON,
      "Authorization": "Bearer " + (sessao ? sessao.access_token : ""),
      "Content-Type": f.type || "application/pdf"
    },
    body: f
  })
  .then(function(r){ if(!r.ok) throw new Error("não deu pra guardar o arquivo"); })
  .then(function(){
    return api("/rest/v1/documentos", {
      method:"POST", headers:{"Prefer":"return=representation"},
      body: JSON.stringify({
        nome:f.name, caminho:caminho, tamanho:f.size,
        caso_id: E.conversaCtx.caso || null
      })
    });
  })
  .then(function(linhas){
    var doc = linhas[0];
    return api("/functions/v1/advogado", {
      method:"POST", body: JSON.stringify({acao:"ler", documento_id:doc.id})
    }).then(function(r){
      E.ultimaAnalise = r.analise;
      E.docAtual = doc.id;
      E.msgs[E.msgs.length - 1] = {papel:"assistant", analise:r.analise, docId:doc.id};
      /* amarra a conversa ao documento: a próxima pergunta que ele
         escrever já sai com o teor do PDF no contexto */
      E.conversaCtx = {documento:doc.id, caso:doc.caso_id || null, nome:doc.nome, tipo:"documento"};
      E.conversaId = null;
      pinta(); rolaFim();
    });
  })
  .catch(function(e){
    E.msgs[E.msgs.length - 1] = {papel:"assistant", texto:"Não consegui ler " + f.name + ": " + e.message};
    pinta();
  });
}

function proximoPasso(qual, bt){
  var docId = E.docAtual;
  if(!docId) return;
  var doc = null;
  E.docs.forEach(function(x){ if(x.id === docId) doc = x; });

  /* Amarra a conversa ao documento — daí qualquer pergunta seguinte já
     sai com o teor dele no contexto. */
  if(qual === 'conversar' || qual === 'peca'){
    E.conversaCtx = {documento:docId, caso:(doc && doc.caso_id) || null,
                     nome:(doc && doc.nome) || 'documento', tipo:'documento'};
    E.conversaId = null; E.msgs = [];
    pinta();
    if(qual === 'peca'){
      /* peça agora sai pela própria conversa, não por uma aba separada */
      var cx = $('pergunta');
      if(cx){ cx.value = 'Redija a peça que responde este documento.'; pergunta(); }
    }
    return;
  }

  var para = qual === 'resumo-cliente' ? 'cliente' : 'escritorio';
  var caso = doc && doc.caso_id ? acha(doc.caso_id) : null;
  ocupado(bt, 'Resumindo…');
  E.msgs.push({papel:'assistant', texto:'', pensando:true});
  pinta(); rolaFim();

  api('/functions/v1/advogado', {
    method:'POST', body: JSON.stringify({acao:'resumir', documento_id:docId, para:para})
  })
  .then(function(r){
    E.msgs[E.msgs.length - 1] = {papel:'assistant', texto:r.resumo,
      zapPara: (para === 'cliente' && caso) ? caso : null};
  })
  .catch(function(e){ E.msgs.pop(); erroAssist(e.message); })
  .then(function(){ livre(bt); pinta(); rolaFim(); });
}

function agendaDaAnalise(indice, docId){
  /* Pega a análise DAQUELE documento, não a última lida: desde que a
     conversa aceita vários PDFs, clicar em "Agendar" numa análise antiga
     agendava a data do documento mais recente. */
  var a = null;
  E.msgs.forEach(function(m){ if(m.analise && m.docId === docId) a = m.analise; });
  if(!a) a = E.ultimaAnalise;
  if(!a || !a.datas || !a.datas[indice]) return;
  var d = a.datas[indice], doc = null;
  E.docs.forEach(function(x){ if(x.id === docId) doc = x; });

  api('/rest/v1/tarefas', {
    method:'POST', headers:{'Prefer':'return=minimal'},
    body: JSON.stringify({
      titulo: d.titulo, tipo: d.tipo,
      quando: new Date(d.data + 'T09:00:00').toISOString(),
      caso_id: (doc && doc.caso_id) || null
    })
  })
  .then(carrega)
  .then(function(){ alert('Agendado: ' + d.titulo + ' em ' + data(d.data)); })
  .catch(function(e){ alert('Não deu pra agendar: ' + e.message); });
}

/* ===================================================================
   TEMPO REAL

   O Supabase publica cada INSERT/UPDATE num websocket. Em vez de o painel
   ficar perguntando "chegou algo?", o banco avisa — mensagem nova do
   WhatsApp, lead novo do site e publicação nova do Diário aparecem na
   tela sem ninguém apertar nada.

   Protocolo é o do Phoenix: entra num canal, manda batida de coração a
   cada 30s, escuta `postgres_changes`. Se o websocket não subir, cai pra
   uma releitura a cada 20s — melhor lento que parado.
   =================================================================== */
var TR = {ws:null, coracao:null, refazendo:null, ref:0, reserva:null};

function tempoReal(){
  if(!URL_SB || !sessao || TR.ws) return;

  var url = URL_SB.replace(/^http/, 'ws') +
            '/realtime/v1/websocket?apikey=' + encodeURIComponent(ANON) + '&vsn=1.0.0';
  var ws;
  try{ ws = new WebSocket(url); }catch(e){ ligaReserva(); return; }
  TR.ws = ws;

  ws.onopen = function(){
    paraReserva();
    manda('realtime:sena', 'phx_join', {
      config: {
        broadcast: {self: false},
        postgres_changes: [
          {event:'*',      schema:'public', table:'mensagens_wpp'},
          {event:'*',      schema:'public', table:'conversas_wpp'},
          {event:'*',      schema:'public', table:'contatos'},
          {event:'*',      schema:'public', table:'wpp_sessao'},
          {event:'*',      schema:'public', table:'gmail_mensagens'},
          {event:'INSERT', schema:'public', table:'casos'},
          {event:'INSERT', schema:'public', table:'publicacoes'},
          {event:'*',      schema:'public', table:'tarefas'},
          {event:'*',      schema:'public', table:'processos'}
        ]
      },
      /* sem o token o Realtime aplica o RLS como anônimo e não vem nada */
      access_token: sessao.access_token
    });
    TR.coracao = setInterval(function(){
      manda('phoenix', 'heartbeat', {});
      /* o token vence em 1h; renovar no canal evita cair do nada */
      if(sessao) manda('realtime:sena', 'access_token', {access_token: sessao.access_token});
    }, 30000);
  };

  ws.onmessage = function(ev){
    var m;
    try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.event !== 'postgres_changes') return;
    var d = m.payload && m.payload.data;
    if(d) chegou(d.table, d.type, d.record || d.old_record || {});
  };

  ws.onclose = function(){
    limpaTR();
    ligaReserva();
    /* reconecta com espera crescente pra não martelar o servidor */
    TR.refazendo = setTimeout(tempoReal, 4000);
  };
  ws.onerror = function(){ try{ ws.close(); }catch(e){} };
}

function manda(topico, evento, payload){
  if(!TR.ws || TR.ws.readyState !== 1) return;
  TR.ws.send(JSON.stringify({topic:topico, event:evento, payload:payload, ref:String(++TR.ref)}));
}

function limpaTR(){
  if(TR.coracao){ clearInterval(TR.coracao); TR.coracao = null; }
  if(TR.refazendo){ clearTimeout(TR.refazendo); TR.refazendo = null; }
  TR.ws = null;
}

function desligaTempoReal(){
  var ws = TR.ws;
  limpaTR(); paraReserva();
  if(ws){ try{ ws.onclose = null; ws.close(); }catch(e){} }
}

function ligaReserva(){
  if(TR.reserva) return;
  TR.reserva = setInterval(function(){
    if(document.hidden || digitando()) return;
    carrega().then(function(){
      /* releitura geral nao traz as mensagens da conversa aberta:
         sem isto, a lista anda e a conversa na tela congela */
      if(E.vista === 'whatsapp' && E.wpp.abertaId){
        var id = E.wpp.abertaId;
        return api('/rest/v1/mensagens_wpp?conversa_id=eq.' + id +
                   '&select=*&order=criado_at&limit=300')
          .then(function(r){
            if(E.wpp.abertaId !== id) return;
            if((r || []).length !== E.wpp.msgs.length) E.wpp.msgs = r || [];
            pinta();
            var cx = $('wppCorpo'); if(cx) cx.scrollTop = cx.scrollHeight;
          });
      }
      pinta();
    }).catch(function(){});
  }, 20000);
}
function paraReserva(){
  if(TR.reserva){ clearInterval(TR.reserva); TR.reserva = null; }
}

/* Alguém escrevendo não pode ter a tela puxada embaixo do dedo. */
function digitando(){
  var a = document.activeElement;
  return !!a && (a.tagName === 'TEXTAREA' ||
                (a.tagName === 'INPUT' && a.type !== 'search' && a.type !== 'checkbox' &&
                 a.type !== 'radio'));
}

var pintaCedo = null;
function repintaLogo(){
  if(pintaCedo) return;
  /* junta rajadas de eventos numa pintura só */
  pintaCedo = setTimeout(function(){
    pintaCedo = null;
    if(digitando()) return;
    pinta();
  }, 350);
}

function chegou(tabela, tipo, linha){
  /* mensagem de WhatsApp na conversa aberta entra na hora, sem recarregar
     tudo — é o caso em que meio segundo de atraso se nota */
  if(tabela === 'mensagens_wpp' && tipo === 'INSERT'){
    if(linha.conversa_id === E.wpp.abertaId){
      var jaTem = E.wpp.msgs.some(function(m){
        return m.id === linha.id || (m.id_wpp && m.id_wpp === linha.id_wpp);
      });
      /* tira o eco da mensagem que já pintamos ao enviar */
      if(!jaTem && linha.de_mim){
        for(var i = E.wpp.msgs.length - 1; i >= 0; i--){
          var t = E.wpp.msgs[i];
          if(String(t.id).indexOf('temp') === 0 && t.texto === linha.texto){
            E.wpp.msgs.splice(i, 1); break;
          }
        }
      }
      if(!jaTem){
        E.wpp.msgs.push(linha);
        if(E.vista === 'whatsapp' && !digitando()){
          pinta();
          var cx = $('wppCorpo'); if(cx) cx.scrollTop = cx.scrollHeight;
        }
        avisaChegada(linha);
      }
    } else if(!linha.de_mim){
      avisaChegada(linha);
    }
  }

  if(tabela === 'wpp_sessao'){ E.wpp.sessao = linha; repintaLogo(); }

  /* o resto muda contador e lista: relê e repinta, agrupado */
  if(agrupa) clearTimeout(agrupa);
  agrupa = setTimeout(function(){
    carrega().then(function(){ if(!digitando()) pinta(); }).catch(function(){});
  }, 700);
}
var agrupa = null;

/* Um toque discreto quando chega mensagem e ele não está olhando. */
function avisaChegada(linha){
  if(linha.de_mim) return;
  if(E.vista === 'whatsapp' && !document.hidden) return;
  try{
    var a = new (window.AudioContext || window.webkitAudioContext)();
    var o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, a.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.22);
    o.start(); o.stop(a.currentTime + 0.24);
  }catch(e){}
  piscaTitulo();
}

var tituloOriginal = document.title, piscando = null;
function piscaTitulo(){
  if(piscando || !document.hidden) return;
  var liga = false;
  piscando = setInterval(function(){
    document.title = (liga = !liga) ? '💬 Mensagem nova' : tituloOriginal;
  }, 1200);
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && piscando){
    clearInterval(piscando); piscando = null; document.title = tituloOriginal;
  }
});

/* Na tela de pareamento a informação muda sozinha (o QR expira, o celular
   lê, a ponte conecta). Sem esta vigia o o advogado escanearia e a tela
   ficaria parada no código velho. */
var vigia = null;
function vigiaSessaoWpp(){
  var precisa = E.vista === 'whatsapp' &&
                (!E.wpp.sessao || E.wpp.sessao.estado !== 'conectado');
  if(precisa && !vigia){
    /* Roda mesmo com o websocket de pé. O canal pode subir e não trazer
       nada (RLS mal configurado, por exemplo) — e aí a tela de QR ficaria
       parada pra sempre. Só enquanto não pareia, e para sozinha depois. */
    vigia = setInterval(function(){
      api('/rest/v1/wpp_sessao?select=*&id=eq.1').then(function(r){
        var nova = (r || [])[0] || null, antes = E.wpp.sessao;
        E.wpp.sessao = nova;
        var mudou = !antes || !nova ||
                    antes.estado !== nova.estado || antes.qr !== nova.qr;
        if(nova && nova.estado === 'conectado') return carrega().then(pinta);
        if(mudou) pinta();
      }).catch(function(){});
    }, 3000);
  } else if(!precisa && vigia){
    clearInterval(vigia); vigia = null;
  }
}

/* Enquanto não conectado (ou ainda sincronizando o histórico), fica de
   olho — igual a vigiaSessaoWpp() já faz pro QR do WhatsApp. */
var vigiaGmailT = null;
function vigiaGmail(){
  var precisa = E.vista === 'gmail' &&
                (!E.gmail.status || !E.gmail.status.conectado || E.gmail.sincronizando);
  if(precisa && !vigiaGmailT){
    vigiaGmailT = setInterval(function(){
      gmailApi('status').then(function(r){
        var conectouAgora = r.conectado && (!E.gmail.status || !E.gmail.status.conectado);
        E.gmail.status = r;
        if(conectouAgora){ carrega().then(pinta); }
        // reconecta OU entrou na aba com backfill ainda pela metade (ex:
        // fechou o painel no meio do primeiro sync) — retoma sozinho.
        if((conectouAgora || r.backfill_pendente) && !E.gmail.sincronizando) sincronizaGmail();
        if(!conectouAgora) pinta();
      }).catch(function(){});
    }, 3000);
  } else if(!precisa && vigiaGmailT){
    clearInterval(vigiaGmailT); vigiaGmailT = null;
  }
}

/* Chama "sincronizar" em sequência (sem sobrepor) até a function avisar
   que não tem mais página de backfill — assim o histórico completo entra
   rápido, em vez de esperar o cron de 5 em 5 minutos ir de pouquinho em
   pouquinho (foi exatamente o erro de lentidão que já cometemos com o
   primeiro sync do WhatsApp). */
function sincronizaGmail(){
  if(E.gmail.sincronizando) return;
  E.gmail.sincronizando = true; pinta();
  (function passo(){
    gmailApi('sincronizar').then(function(r){
      if(r.mais){ return carrega().then(passo); }
      E.gmail.sincronizando = false;
      return carrega().then(pinta);
    }).catch(function(){
      E.gmail.sincronizando = false; pinta();
    });
  })();
}

function abreThreadGmail(threadId){
  if(E.gmail.abertaThread !== threadId) E.gmail.anexos = [];  // anexo é da resposta daquela conversa
  E.gmail.abertaThread = threadId;
  marcaGmailLida(threadId);
  pinta();
  var cx = $('gmailCorpo'); if(cx) cx.scrollTop = cx.scrollHeight;

  /* A lista não traz corpo (ver COLS_GMAIL). Ao abrir, busca o corpo só
     dessa conversa — UMA chamada ao banco, não uma por mensagem. Só cai
     no Gmail (Edge Function) se o corpo nunca tiver sido salvo. */
  var faltando = E.gmail.caixa.filter(function(m){ return m.thread_id === threadId && m.corpo == null; });
  if(!faltando.length) return;

  E.gmail.carregandoCorpo = threadId;
  api('/rest/v1/gmail_mensagens?select=gmail_id,corpo,html&thread_id=eq.' + encodeURIComponent(threadId))
    .then(function(linhas){
      var porId = {};
      (linhas || []).forEach(function(l){ porId[l.gmail_id] = l; });
      var semCorpo = [];
      E.gmail.caixa.forEach(function(m){
        if(m.thread_id !== threadId) return;
        var l = porId[m.gmail_id];
        if(l && l.corpo != null){ m.corpo = l.corpo; m.html = l.html; }
        else if(m.corpo == null) semCorpo.push(m.gmail_id);
      });
      E.gmail.carregandoCorpo = null;
      if(E.gmail.abertaThread === threadId) pinta();
      semCorpo.forEach(carregaCorpoGmail);
    })
    .catch(function(e){
      E.gmail.carregandoCorpo = null;
      var el = $('erroGmail'); if(el) el.textContent = e.message;
    });
}

function carregaCorpoGmail(gmailId){

/* ---------- anexos ---------- */
/* O arquivo vira base64 aqui no navegador e viaja junto com o pedido de
   envio; quem monta o MIME multipart é a Edge Function. Guardar o base64
   no estado (e não confiar no <input type=file>) é o que faz o anexo
   sobreviver a um repinte da tela. */
function listaAnexoDe(idContainer){
  return idContainer === 'gmailAnexosNovo' ? E.gmail.anexosNovo : E.gmail.anexos;
}

function tamanhoArq(b){
  if(b === null || b === undefined) return '';
  return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
}

function pintaAnexos(idContainer){
  var cx = $(idContainer); if(!cx) return;
  cx.innerHTML = listaAnexoDe(idContainer).map(function(a, i){
    return '<span class="anexo-chip"><b>' + esc(a.nome) + '</b>' +
      '<span class="li-s">' + tamanhoArq(a.tamanho) + '</span>' +
      '<button data-tira-anexo="' + idContainer + ':' + i + '" aria-label="Remover anexo">' + ico('x') + '</button></span>';
  }).join('');
}

function leAnexos(arquivos, idContainer){
  var lista = listaAnexoDe(idContainer), pendentes = arquivos.length;
  if(!pendentes) return;
  [].forEach.call(arquivos, function(f){
    var leitor = new FileReader();
    leitor.onload = function(){
      lista.push({nome:f.name, tipo:f.type || 'application/octet-stream',
                  dados:String(leitor.result).split(',')[1] || '', tamanho:f.size});
      if(--pendentes === 0) pintaAnexos(idContainer);
    };
    leitor.onerror = function(){ if(--pendentes === 0) pintaAnexos(idContainer); };
    leitor.readAsDataURL(f);
  });
}

/* ---------------------------------------------------------------
   O texto dos avisos de WhatsApp.

   Existe igual na função `lembretes` do servidor, que é quem manda de
   verdade. Aqui é só pra ele ver na tela como vai chegar antes de ligar
   — quem escreve pro cliente do outro lado tem que saber o que sai.
--------------------------------------------------------------- */
function textoDiario(){
  var hoje = ymd(new Date()),
      doDia = E.tarefas.filter(function(t){ return !t.feita && ymd(new Date(t.quando)) === hoje; })
        .sort(function(a,b){ return new Date(a.quando) - new Date(b.quando); }),
      atrasadas = E.tarefas.filter(function(t){
        return !t.feita && ymd(new Date(t.quando)) < hoje; }),
      prescrevem = E.casos.filter(function(c){
        return ativo(c) && c.dias_restantes !== null &&
               c.dias_restantes >= 0 && c.dias_restantes <= 30; }),
      novos = E.casos.filter(function(c){
        return c.etapa === 'triagem' && (Date.now() - new Date(c.criado_at)) < 86400000; });

  if(!doDia.length && !atrasadas.length && !prescrevem.length && !novos.length)
    return 'Bom dia, ' + primeiro(ADV) + '. Nada marcado para hoje e nenhum prazo apertado.';

  var l = ['*Bom dia, ' + primeiro(ADV) + '.* Seu dia:', ''];
  if(doDia.length){
    l.push('*Hoje*');
    doDia.forEach(function(t){
      var c = acha(t.caso_id), tt = TIPO_TAREFA[t.tipo] || TIPO_TAREFA.tarefa;
      l.push('• ' + hora(t.quando) + ' — ' + t.titulo + (c ? ' (' + c.nome + ')' : '') +
             ' [' + tt[0].toLowerCase() + ']');
    });
    l.push('');
  }
  if(atrasadas.length){
    l.push('*Atrasado* (' + atrasadas.length + ')');
    atrasadas.slice(0,5).forEach(function(t){
      var c = acha(t.caso_id);
      l.push('• ' + t.titulo + (c ? ' (' + c.nome + ')' : '') + ' — venceu ' + ateQuando(t.quando));
    });
    l.push('');
  }
  if(prescrevem.length){
    l.push('*Prescreve em menos de 30 dias*');
    prescrevem.forEach(function(c){
      l.push('• ' + c.nome + ' — ' + c.dias_restantes + ' dias (' + data(c.prescreve_em) + ')');
    });
    l.push('');
  }
  if(novos.length) l.push('*' + novos.length + ' caso' + (novos.length>1?'s novos':' novo') +
                          '* esperando triagem.');
  return l.join('\n').trim();
}

function textoSemanal(){
  var agora = new Date(), seteDias = 7*86400000,
      novos = E.casos.filter(function(c){ return (Date.now() - new Date(c.criado_at)) < seteDias; }),
      abertos = E.casos.filter(ativo),
      pendentes = E.tarefas.filter(function(t){ return !t.feita && new Date(t.quando) < agora; }),
      daSemana = E.tarefas.filter(function(t){
        var q = new Date(t.quando);
        return !t.feita && q >= agora && q < new Date(agora.getTime() + seteDias); })
        .sort(function(a,b){ return new Date(a.quando) - new Date(b.quando); }),
      criticos = abertos.filter(function(c){
        return c.alerta_prazo === 'critico' || c.alerta_prazo === 'prescrito'; }),
      semTriagem = E.casos.filter(function(c){ return c.etapa === 'triagem'; }),
      pubsNovas = E.pubs.filter(function(p){ return !p.lida; });

  var l = ['*Resumo da semana — Escritório*', ''];
  l.push('*Como está*');
  l.push('• ' + abertos.length + ' casos em aberto');
  l.push('• ' + novos.length + ' entraram nos últimos 7 dias');
  l.push('• ' + semTriagem.length + ' esperando triagem');
  if(pubsNovas.length) l.push('• ' + pubsNovas.length + ' publicação(ões) do Diário sem ler');
  l.push('');

  if(criticos.length){
    l.push('*Prazo apertado* (' + criticos.length + ')');
    criticos.slice(0,6).forEach(function(c){
      l.push('• ' + c.nome + ' — ' + (c.dias_restantes < 0 ? 'VENCIDO' : c.dias_restantes + ' dias'));
    });
    l.push('');
  }
  if(pendentes.length){
    l.push('*Ficou pendente* (' + pendentes.length + ')');
    pendentes.slice(0,6).forEach(function(t){
      var c = acha(t.caso_id);
      l.push('• ' + t.titulo + (c ? ' (' + c.nome + ')' : ''));
    });
    l.push('');
  }
  if(daSemana.length){
    l.push('*Esta semana*');
    daSemana.slice(0,10).forEach(function(t){
      var c = acha(t.caso_id), d = new Date(t.quando),
          dia = ['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()];
      l.push('• ' + dia + ' ' + d.getDate() + ', ' + hora(t.quando) + ' — ' + t.titulo +
             (c ? ' (' + c.nome + ')' : ''));
    });
  } else l.push('*Esta semana* — nada marcado.');

  return l.join('\n').trim();
}

document.addEventListener('click', function(e){
  var al = e.target.closest('[data-ir]');
  if(al){
    if(al.dataset.ir === 'criticos'){ E.filtro = 'criticos'; E.modo = 'lista'; vai('esteira'); }
    else { E.filtro = null; vai(al.dataset.ir); }
    return;
  }

  var nav = e.target.closest('.nav a');
  if(nav){ e.preventDefault(); E.filtro = null; fechaLado(); vai(nav.dataset.v); return; }

  var caso = e.target.closest('[data-caso]');
  if(caso && caso.dataset.caso){
    if(caso.dataset.arrastou) return;      /* veio de um arrasto, não de um clique */
    fechaModal(); vai('caso', caso.dataset.caso); return;
  }

  var ir2 = e.target.closest('[data-ir2]');
  if(ir2 && ir2.dataset.ir2){ fechaModal(); vai(ir2.dataset.ir2); return; }

  var rap = e.target.closest('[data-rapida]');
  if(rap){
    var a = rap.dataset.rapida;
    if(a === 'novo')   modalNovoCaso();
    if(a === 'ler'){ vai('assistente'); var arq = $('arquivo'); if(arq) arq.click(); }
    if(a === 'varrer') varrerDiario(null);
    if(a === 'criticos'){ E.filtro = 'criticos'; E.modo = 'lista'; vai('esteira'); }
    if(a === 'triar'){
      var fila = E.casos.filter(function(c){ return c.etapa === 'triagem'; });
      if(fila.length) vai('caso', fila[fila.length-1].id);
      else alert('Nenhum caso esperando triagem.');
    }
    return;
  }

  var fil = e.target.closest('[data-filtro]');
  if(fil){ E.filtro = fil.dataset.filtro || null; pinta(); return; }

  var at = e.target.closest('[data-atalho]');
  if(at){
    $('pergunta').value = at.dataset.atalho;
    ajustaAltura($('pergunta'));
    pergunta();
    return;
  }

  var cw = e.target.closest('[data-conversa-wpp]');
  if(cw){ abreConversaWpp(cw.dataset.conversaWpp); return; }

  var tg = e.target.closest('[data-abre-thread-gmail]');
  if(tg){ abreThreadGmail(tg.dataset.abreThreadGmail); return; }

  var pg = e.target.closest('[data-pasta-gmail]');
  if(pg){ E.gmail.pasta = pg.dataset.pastaGmail; E.gmail.abertaThread = null; pinta(); return; }

  var td = e.target.closest('[data-tira-doc]');
  if(td){
    E.assistArquivos.splice(parseInt(td.dataset.tiraDoc, 10), 1);
    pintaAnexoAssist();
    return;
  }

  var ta = e.target.closest('[data-tira-anexo]');
  if(ta){
    var alvo = ta.dataset.tiraAnexo.split(':');
    listaAnexoDe(alvo[0]).splice(parseInt(alvo[1], 10), 1);
    pintaAnexos(alvo[0]);
    return;
  }

  var cg = e.target.closest('[data-abre-corpo-gmail]');
  if(cg){ carregaCorpoGmail(cg.dataset.abreCorpoGmail); return; }

  var cv = e.target.closest('[data-conversa]');
  if(cv){ abreConversa(cv.dataset.conversa); return; }

  var pp = e.target.closest('[data-passo]');
  if(pp){ proximoPasso(pp.dataset.passo, pp); return; }

  var vt = e.target.closest('[data-vira-tarefa]');
  if(vt){ agendaDaAnalise(parseInt(vt.dataset.viraTarefa, 10), vt.dataset.doc); return; }

  var vd = e.target.closest('[data-documento]');
  if(vd){
    var d = null;
    E.docs.forEach(function(x){ if(x.id === vd.dataset.documento) d = x; });
    if(d && d.analise_at){
      E.docAtual = d.id;
      E.conversaCtx = {documento:d.id, caso:d.caso_id || null, nome:d.nome, tipo:'documento'};
      E.conversaId = null;
      E.msgs = [];
      vai('assistente');
      carregaAnaliseDoc(d.id).then(function(a){
        if(!a) return;
        E.ultimaAnalise = a;
        E.msgs = [{papel:'assistant', analise:a, docId:d.id}];
        pinta(); rolaFim();
      });
    }
    else if(d) alert('Esse documento ainda não foi lido.');
    return;
  }

  var mo = e.target.closest('[data-modo]');
  if(mo){ E.modo = mo.dataset.modo; pinta(); return; }

  var ar = e.target.closest('[data-area]');
  if(ar){ E.area = ar.dataset.area; pinta(); return; }

  var dia = e.target.closest('[data-dia]');
  if(dia){ E.diaSel = dia.dataset.dia; pinta(); return; }

  var proc = e.target.closest('[data-processo]');
  if(proc){
    E.processoAberto = proc.dataset.processo || null;
    E.procAba = 'resumo';
    if(E.vista !== 'processos' && E.vista !== 'observacao') vai('processos');
    else pinta();
    if(E.processoAberto) carregaMovimentosProcesso(E.processoAberto);
    return;
  }
  if(e.target.closest('[data-voltar-processos]')){ E.processoAberto = null; pinta(); return; }

  var oa = e.target.closest('[data-obs-aba]');
  if(oa){ E.obsAba = oa.dataset.obsAba; pinta(); return; }

  var pa = e.target.closest('[data-proc-aba]');
  if(pa){
    E.procAba = pa.dataset.procAba;
    pinta();
    if(E.procAba === 'publicacoes') carregaTextoPubs(E.processoAberto);
    return;
  }

  var fp = e.target.closest('[data-filtro-processo]');
  if(fp){ E.filtroProc = fp.dataset.filtroProcesso || null; pinta(); return; }

  var cp = e.target.closest('[data-confirma-processo]');
  if(cp){ acaoProcesso(cp.dataset.confirmaProcesso, 'confirmar'); return; }

  var ip = e.target.closest('[data-ignora-processo]');
  if(ip){
    if(confirm('Ignorar este processo? Ele sai da lista de observação, mas fica salvo — dá pra reavaliar depois.'))
      acaoProcesso(ip.dataset.ignoraProcesso, 'ignorar');
    return;
  }

  var rp = e.target.closest('[data-reavalia-processo]');
  if(rp){ acaoProcesso(rp.dataset.reavaliaProcesso, 'reavaliar'); return; }

  var ep = e.target.closest('[data-edita-processo]');
  if(ep){ modalEditaProcesso(ep.dataset.editaProcesso); return; }

  var aip = e.target.closest('[data-abre-ia-processo]');
  if(aip){
    var pid = aip.dataset.abreIaProcesso, procIa = null;
    E.processos.forEach(function(x){ if(x.id === pid) procIa = x; });
    E.conversaCtx = {processo:pid, nome:procIa ? (procIa.processo||'') : '', tipo:'processo'};
    E.conversaId = null; E.msgs = [];
    vai('assistente');
    if(aip.dataset.atalhoProc){
      setTimeout(function(){
        $('pergunta').value = aip.dataset.atalhoProc;
        ajustaAltura($('pergunta'));
        pergunta();
      }, 0);
    }
    return;
  }

  var mes = e.target.closest('[data-mes]');
  if(mes){
    var p = parseInt(mes.dataset.mes, 10);
    E.mesRef = p === 0 ? new Date() : new Date(E.mesRef.getFullYear(), E.mesRef.getMonth() + p, 1);
    pinta(); return;
  }

  var fe = e.target.closest('[data-feita]');
  if(fe){ marcaFeita(fe.dataset.feita); return; }

  var nt = e.target.closest('[data-nova-tarefa]');
  if(nt){ modalNovaTarefa(nt.dataset.novaTarefa || null); return; }

  var txt = e.target.closest('[data-abrir-txt]');
  if(txt){
    var alvo = txt.closest('.linha-item').querySelector('[data-pub-txt]');
    alvo.classList.toggle('aberta');
    txt.textContent = alvo.classList.contains('aberta') ? 'Recolher' : 'Ler tudo';
    return;
  }
  var lida = e.target.closest('[data-lida]');
  if(lida){
    api('/rest/v1/publicacoes?id_cnj=eq.' + lida.dataset.lida, {
      method:'PATCH', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({lida:true})
    }).then(carrega).then(pinta).catch(function(x){ alert(x.message); });
    return;
  }
  var and = e.target.closest('[data-andamento]');
  if(and){ verAndamento(and.dataset.andamento, and.dataset.trib, and.dataset.processoId); return; }

  if(e.target.closest('[data-fecha]')) { fechaModal(); return; }
  if(e.target.id === 'fundoModal')     { fechaModal(); return; }

  var id = e.target.closest('button') ? e.target.closest('button').id : '';
  if(id === 'btSalva')      salvar();
  else if(id === 'btMov')   registraMov();
  else if(id === 'btIA')    analisa();
  else if(id === 'btApaga') apaga();
  else if(id === 'btNovo')  modalNovoCaso();
  else if(id === 'btSino')  modalAlertas();
  else if(id === 'btVarrer') varrerDiario(e.target.closest('button'));
  else if(id === 'btCriaCaso')   criaCaso();
  else if(id === 'btCriaTarefa') criaTarefa();
  else if(id === 'btAssinar')    modalAssinar();
  else if(id === 'btPerguntarCaso'){
    var cc = acha(E.casoId);
    E.conversaCtx = {caso:E.casoId, nome:cc ? cc.nome : '', tipo:'caso'};
    E.conversaId = null; E.msgs = [];
    vai('assistente');
  }
  else if(id === 'btMinutarCaso'){
    var cm = acha(E.casoId);
    E.conversaCtx = {caso:E.casoId, nome:cm ? cm.nome : '', tipo:'caso'};
    E.conversaId = null; E.msgs = [];
    vai('assistente');
    var cxm = $('pergunta');
    if(cxm){ cxm.value = 'Minute a peça deste caso.'; ajustaAltura(cxm); cxm.focus(); }
  }
  else if(id === 'btPerguntar')    pergunta();
  else if(id === 'btVoz')          alternaVoz();
  else if(id === 'btEnviaWpp')     enviaWpp();
  else if(id === 'btConectaGmail')   conectaGmail();
  else if(id === 'btSincronizaGmail') sincronizaGmail();
  else if(id === 'btEnviaGmail')      enviaGmail();
  else if(id === 'btNovoEmail')       modalNovoEmailGmail();
  else if(id === 'btEnviaNovoEmail')  enviaNovoEmailGmail();
  else if(id === 'btAnexoGmail')      $('arqGmail').click();
  else if(id === 'btAnexoNovoEmail')  $('arqGmailNovo').click();
  else if(id === 'btAssinaturaGmail') modalAssinaturaGmail();
  else if(id === 'btSalvaAssinatura') salvaAssinaturaGmail();
  else if(id === 'btSalvaEdicaoProcesso') salvaEdicaoProcesso(e.target.closest('button').dataset.processoId);
  else if(id === 'btSalvaContato') salvaContato();
  else if(id === 'btViraCaso')     viraCaso();
  else if(id === 'btCriaDoContato')criaDoContato();
  else if(id === 'btNovaConversa') novaConversa();
  else if(id === 'btAnexoDoc')  $('arquivo').click();
  else if(id === 'btCopiaMinuta'){
    var mt = $('minutaTexto').textContent, bm = e.target.closest('button');
    if(navigator.clipboard) navigator.clipboard.writeText(mt);
    bm.textContent = 'Copiado';
    setTimeout(function(){ if(bm) bm.textContent = 'Copiar'; }, 1500);
  }
  else if(id === 'btPreviaDia')    modalPrevia('diario');
  else if(id === 'btPreviaSemana') modalPrevia('semanal');
  else if(id === 'btMenu'){ $('lateral').classList.add('aberta');
    var capa = document.createElement('div'); capa.className = 'capa-lado'; capa.id = 'capaLado';
    capa.addEventListener('click', fechaLado); document.body.appendChild(capa); }
  else if(id === 'btCopia' || id === 'btCopiaIcs'){
    var t = id === 'btCopia' ? $('rascunho').textContent : $('urlIcs').value, b = e.target.closest('button');
    if(navigator.clipboard) navigator.clipboard.writeText(t);
    b.textContent = 'Copiado'; setTimeout(function(){ if(b) b.textContent = 'Copiar' + (id === 'btCopiaIcs' ? ' endereço' : ''); }, 1500);
  }
});

function fechaLado(){
  $('lateral').classList.remove('aberta');
  var c = $('capaLado'); if(c) c.remove();
}

/* o input de arquivo é recriado a cada pintura, então o ouvinte fica no
   documento em vez de no elemento */
document.addEventListener('input', function(e){
  if(e.target.id === 'pergunta' || e.target.id === 'wppTexto' || e.target.id === 'gmailTexto') ajustaAltura(e.target);
  if(e.target.id === 'wppBusca'){
    E.wpp.busca = e.target.value;
    var foco = document.activeElement === e.target, pos = e.target.selectionStart;
    pinta();
    if(foco){ var novo = $('wppBusca'); if(novo){ novo.focus(); novo.setSelectionRange(pos,pos); } }
  }
  if(e.target.id === 'gmailBusca'){
    E.gmail.busca = e.target.value;
    var focoG = document.activeElement === e.target, posG = e.target.selectionStart;
    pinta();
    if(focoG){ var novoG = $('gmailBusca'); if(novoG){ novoG.focus(); novoG.setSelectionRange(posG,posG); } }
  }
});
document.addEventListener('keydown', function(e){
  if(e.target.id === 'pergunta' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault(); pergunta();
  }
  if(e.target.id === 'wppTexto' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault(); enviaWpp();
  }
  if(e.target.id === 'gmailTexto' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault(); enviaGmail();
  }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'arqGmail'){     leAnexos(e.target.files, 'gmailAnexos');     e.target.value = ''; return; }
  if(e.target.id === 'arqGmailNovo'){ leAnexos(e.target.files, 'gmailAnexosNovo'); e.target.value = ''; return; }
  if(e.target.id === 'arquivo'){
    E.assistArquivos = (E.assistArquivos || []).concat([].slice.call(e.target.files));
    e.target.value = '';
    pintaAnexoAssist();
  }
});

/* chips dos PDFs escolhidos, ao lado do campo da conversa */
function pintaAnexoAssist(){
  var cx = $('assistAnexo'); if(!cx) return;
  cx.innerHTML = (E.assistArquivos || []).map(function(f, i){
    return '<span class="anexo-chip"><b>' + esc(f.name) + '</b>' +
      '<span class="li-s">' + tamanhoArq(f.size) + '</span>' +
      '<button data-tira-doc="' + i + '" aria-label="Remover anexo">' + ico('x') + '</button></span>';
  }).join('');
}


$('busca').addEventListener('input', function(){
  E.busca = this.value;
  /* buscar no meio de um caso ou do painel joga pra lista, que é onde
     a busca faz sentido. Dentro de processos, busca processo. */
  if(E.vista === 'caso' || E.vista === 'painel' || E.vista === 'agenda'){
    E.modo = 'lista'; vai('esteira');
  } else pinta();
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ fechaModal(); fechaLado(); }
  if((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)){ e.preventDefault(); $('busca').focus(); }
});

$('formEntrada').addEventListener('submit', function(e){
  e.preventDefault();
  var bt = $('btEntrar');
  bt.disabled = true; bt.textContent = 'Entrando…';
  $('erroEntrada').textContent = '';
  entrar($('email').value.trim(), $('senha').value)
    .then(abre)
    .catch(function(err){
      $('erroEntrada').textContent = /Invalid login/i.test(err.message)
        ? 'E-mail ou senha não conferem.' : err.message;
    })
    .then(function(){ bt.disabled = false; bt.textContent = 'Entrar'; });
});

function sair(){
  desligaTempoReal();
  limpaSessao();
  $('app').classList.add('oculto');
  $('telaEntrada').classList.remove('oculto');
  fechaModal();
}
$('btSair').addEventListener('click', function(){
  if(sessao) fetch(URL_SB + '/auth/v1/logout', {
    method:'POST', headers:{'apikey':ANON,'Authorization':'Bearer ' + sessao.access_token}
  }).catch(function(){});
  sair();
});

function abre(){
  $('telaEntrada').classList.add('oculto');
  $('app').classList.remove('oculto');
  var email = (sessao && sessao.user && sessao.user.email) || '';
  $('euN').textContent = ADV;
  $('euAv').textContent = iniciais(ADV || email);
  daHash();
  tempoReal();
  carrega().then(pinta).catch(function(e){
    $('conteudo').innerHTML = '<div class="bloco"><div class="vazio">Não deu pra carregar: ' +
      esc(e.message) + '</div></div>';
  });
}

/* ---------- partida ---------- */
if(!URL_SB || !ANON){
  $('erroEntrada').textContent = 'Falta configurar o Supabase no build.py (SUPABASE_URL e SUPABASE_ANON).';
  $('btEntrar').disabled = true;
} else if(sessao && sessao.refresh_token){
  renova().then(abre, function(){ limpaSessao(); });
}

/* recarrega ao voltar pra aba — o dia do advogado acontece fora daqui */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && sessao && !$('app').classList.contains('oculto'))
    carrega().then(pinta).catch(function(){});
});
})();
</script>
</body>
</html>
